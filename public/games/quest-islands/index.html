              if (i0 > 0) wrap.appendChild(el('span', { class: 'rd-pn rd-pn-l' }, tok.slice(0, i0)));
              var b = el('button', { type: 'button', class: 'rd-w', onclick: function () { o.onWord(c, b); } }, c);
              wrap.appendChild(b);
              var rest = tok.slice(i0 + c.length);
              if (rest) wrap.appendChild(el('span', { class: 'rd-pn' }, rest));
              unitEl.appendChild(wrap);
            });
          } else {
            unitEl = el('span', { class: 'rd-s' }, u);
          }
          unitEl._u = u;
          if (p.list) holder.appendChild(el('li', null, unitEl));
          else {
            holder.appendChild(unitEl);
            if (t.kind !== 'poem' && ui < us.length - 1) holder.appendChild(document.createTextNode(' '));
          }
        });
        body.appendChild(holder);
        row.appendChild(num);
        row.appendChild(body);
        box.appendChild(row);
      });
      return box;
    }

    /* ---------- screen 1: choose a text ---------- */
    function showMenu() {
      clearScreen();
      api.progress(0, 1);
      var scene = el('div', { class: 'rd-scene', html: sceneSVG(6) });
      setLamp(scene, ['on', 'on', 'on'], 6);
      var cards = [];
      function select(k) {
        chosen = k;
        cards.forEach(function (c) { var on = c._k === k; c.classList.toggle('is-on', on); c.setAttribute('aria-pressed', String(on)); });
      }
      TEXTS.forEach(function (t, i) {
        var c = el('button', { type: 'button', class: 'qi-mode', onclick: function () { api.sound('tap'); select(i); } },
          el('span', { class: 'rd-genre g-' + t.family, text: t.genre }),
          el('b', { text: t.title }),
          el('span', { text: t.blurb + ' ' + Math.min(RUN, t.qs.length) + ' questions.' }));
        c._k = i;
        cards.push(c);
      });
      var lucky = el('button', { type: 'button', class: 'qi-mode', onclick: function () { api.sound('tap'); select('lucky'); } },
        el('span', { class: 'rd-genre g-lucky', text: 'Mixed' }),
        el('b', { text: 'Lucky dip' }),
        el('span', { text: 'Let the keeper choose any text for you. A surprise every time!' }));
      lucky._k = 'lucky';
      cards.push(lucky);
      select(chosen);

      screen.appendChild(el('div', { class: 'rd-narrow qi-stack' },
        el('div', { class: 'rd-hero' },
          el('span', { class: 'qi-eyebrow', text: 'Story Lighthouse' }),
          el('h2', { class: 'qi-h', text: 'Light the Lamp' }),
          el('p', { class: 'qi-sub', text: 'The lighthouse lamp has gone dark and ships are lost in the night! Read a text carefully, answer the keeper’s questions, and every right answer lights a pane of the lamp.' })),
        scene,
        el('p', { class: 'qi-prompt', text: 'Choose a text to read' }),
        el('div', { class: 'qi-menu', role: 'group', 'aria-label': 'Choose a text' }, cards),
        el('div', { class: 'qi-row rd-playrow' },
          el('button', { type: 'button', class: 'qi-btn rd-play', onclick: function () {
            var i = chosen === 'lucky' ? Math.floor(Math.random() * TEXTS.length) : chosen;
            api.sound('tap');
            showRead(TEXTS[i]);
          } }, 'Start reading'))));
    }

    /* ---------- screen 2: read the text ---------- */
    function showRead(t) {
      clearScreen();
      api.progress(0, Math.min(RUN, t.qs.length));
      var go = el('button', { type: 'button', class: 'qi-btn', onclick: function () { api.sound('tap'); showPlay(t); } }, 'I’ve read it. Light the lamp!');
      screen.appendChild(el('div', { class: 'rd-readwrap qi-stack' },
        el('div', { class: 'qi-row' },
          el('button', { type: 'button', class: 'qi-btn secondary rd-small', onclick: function () { api.sound('tap'); showMenu(); } }, '← All texts')),
        el('div', { class: 'qi-stack', style: { gap: '10px' } },
          el('span', { class: 'rd-genre g-' + t.family, text: t.genre }),
          el('p', { class: 'rd-tip' }, el('b', { text: 'Keeper’s tip: ' }), t.tip)),
        speechBar(t),
        el('article', { class: 'qi-panel rd-paper', 'aria-label': t.title },
          el('h2', { class: 'rd-doctitle', text: t.title }),
          buildText(t, { mode: 'read', hTag: 'h3' })),
        el('div', { class: 'qi-row rd-playrow' }, go)));
    }

    /* ---------- screen 3: questions with the text alongside ---------- */
    function showPlay(t) {
      clearScreen();
      // A fresh random selection and order from the text's bank on every run.
      var qs = api.pick(t.qs, Math.min(RUN, t.qs.length)), n = qs.length, qi = 0, score = 0, states = [];

      var scene = el('div', { class: 'rd-scene' });
      scene.innerHTML = sceneSVG(n);
      scene.appendChild(el('span', { class: 'rd-lampnote' }));
      setLamp(scene, states, n);

      var tbody = el('div', { class: 'rd-tbody' });
      var toggle = el('button', { type: 'button', class: 'rd-mini rd-toggle', 'aria-expanded': 'true', onclick: function () { setCollapsed(!textCol.classList.contains('is-collapsed')); } }, 'Hide text');
      var textCol = el('section', { class: 'qi-panel rd-paper rd-textcol', 'aria-label': 'The text: ' + t.title },
        el('div', { class: 'rd-thead' },
          el('div', { class: 'rd-ttl' }, el('span', { class: 'rd-genre g-' + t.family, text: t.genre }), el('h3', { text: t.title })),
          el('div', { class: 'rd-tools' },
            hasSpeech ? el('button', { type: 'button', class: 'rd-mini rd-say', 'aria-label': 'Read the whole text aloud', html: ICON_SAY, onclick: function () { sayAll(textChunks(t)); } }) : null,
            hasSpeech ? el('button', { type: 'button', class: 'rd-mini rd-say', 'aria-label': 'Stop reading aloud', html: ICON_STOP, onclick: hush }) : null,
            toggle)),
        tbody);
      var qcol = el('section', { class: 'qi-panel qi-stack rd-qcol', 'aria-label': 'Question' });
      screen.appendChild(el('div', { class: 'rd-split' }, el('div', { class: 'rd-scenecol' }, scene), textCol, qcol));

      function setCollapsed(c) {
        textCol.classList.toggle('is-collapsed', c);
        toggle.textContent = c ? 'Show text' : 'Hide text';
        toggle.setAttribute('aria-expanded', String(!c));
      }
      function setText(o) {
        var keep = tbody.scrollTop;
        tbody.innerHTML = '';
        tbody.appendChild(buildText(t, o));
        tbody.scrollTop = keep;
        textCol.classList.toggle('is-tapping', o.mode !== 'read');
      }
      function lockText() {
        var box = tbody.querySelector('.rd-text');
        if (!box) return;
        box.classList.add('is-locked');
        [].forEach.call(box.querySelectorAll('.rd-w'), function (b) { b.disabled = true; });
        [].forEach.call(box.querySelectorAll('.rd-s[role=button]'), function (s) { s.setAttribute('tabindex', '-1'); s.setAttribute('aria-disabled', 'true'); });
        textCol.classList.remove('is-tapping');
      }
      function scrollTextTo(node) {
        if (!node) return;
        try { tbody.scrollTo({ top: Math.max(0, node.offsetTop - 40), behavior: smooth() }); } catch (e) { tbody.scrollTop = Math.max(0, node.offsetTop - 40); }
      }
      function revealText(paraN) {
        setCollapsed(false);
        if (paraN) scrollTextTo(tbody.querySelector('[data-n="' + paraN + '"]'));
        else tbody.scrollTop = 0;
        if (narrow()) textCol.scrollIntoView({ block: 'start', behavior: smooth() });
      }

      function renderQ() {
        var q = qs[qi];
        api.progress(qi, n);
        setText({ mode: 'read' });
        qcol.innerHTML = '';
        var area = el('div', { class: 'qi-stack' });
        var fb = el('div', { class: 'rd-fb', 'aria-live': 'polite' });
        qcol.appendChild(el('div', { class: 'qi-row rd-qhead' },
          el('span', { class: 'qi-eyebrow', text: 'Question ' + (qi + 1) + ' of ' + n }),
          el('span', { class: 'qi-tag', text: q.skill })));
        var prompt = el('p', { class: 'qi-prompt', tabindex: '-1', text: q.q });
        qcol.appendChild(el('div', { class: 'rd-prow' },
          prompt,
          hasSpeech ? el('button', { type: 'button', class: 'rd-mini rd-say', 'aria-label': 'Read the question aloud', html: ICON_SAY, onclick: function () { say(q.q); } }) : null));
        qcol.appendChild(area);
        qcol.appendChild(fb);
        // the Next button that had focus is gone: move focus to the new question
        try { prompt.focus({ preventScroll: true }); } catch (e) {}
        if (q.t === 'mc' || q.t === 'prove') doMC(q, area, fb);
        else if (q.t === 'word') doWord(q, area, fb);
        else if (q.t === 'order') doOrder(q, area, fb);
        else if (q.t === 'fo') doFO(q, area, fb);
      }

      function done(ok, fb, q, extra, headline) {
        states[qi] = ok ? 'on' : 'miss';
        if (ok) score++;
        setLamp(scene, states, n);
        api.progress(qi + 1, n);
        lockText();
        fb.innerHTML = '';
        fb.appendChild(el('p', { class: 'qi-feedback ' + (ok ? 'good' : 'bad'), text: headline || (ok ? pickOne(PRAISE) : 'Not this time. The keeper explains:') }));
        if (extra) fb.appendChild(extra);
        fb.appendChild(el('div', { class: 'rd-why' }, el('b', { text: 'Why? ' }), q.why));
        var last = qi === n - 1;
        var nb = el('button', { type: 'button', class: 'qi-btn', onclick: function () {
          api.sound('tap');
          if (last) { hush(); api.finish({ score: score, max: n }); return; }
          qi++;
          renderQ();
          if (narrow()) scene.scrollIntoView({ block: 'start', behavior: 'auto' });
        } }, last ? 'See how bright your lamp is' : 'Next question →');
        fb.appendChild(el('div', { class: 'qi-row' }, nb));
        try { nb.focus({ preventScroll: true }); } catch (e) {}
        if (narrow()) later(function () { fb.scrollIntoView({ block: 'nearest', behavior: smooth() }); }, 60);
      }

      /* multiple choice, and step 1 of "Prove it!" */
      function doMC(q, area, fb) {
        var box = el('div', { class: 'qi-choices' });
        var btns = api.shuffle(q.options).map(function (o) {
          var b = el('button', { type: 'button', class: 'qi-choice', onclick: function () { choose(o, b); } }, o);
          b._o = o;
          box.appendChild(b);
          return b;
        });
        area.appendChild(box);
        function choose(o, b) {
          var ok = o === q.answer;
          btns.forEach(function (x) { x.disabled = true; if (x._o === q.answer) x.classList.add('is-correct'); });
          if (!ok) b.classList.add('is-wrong');
          if (q.t === 'mc') {
            if (ok) api.correct(b); else api.wrong(b);
            done(ok, fb, q);
            return;
          }
          if (ok) api.sound('correct'); else api.wrong(b);
          proveStep(q, area, fb, ok);
        }
      }

      /* step 2 of "Prove it!": tap the evidence sentence */
      function proveStep(q, area, fb, mcOk) {
        var tries = 0, finished = false, tried = [], unit = t.kind === 'poem' ? 'line' : 'sentence';
        var msg = el('p', { class: 'rd-msg', role: 'status', 'aria-live': 'polite' });
        var instr = el('div', { class: 'rd-instr', tabindex: '-1' },
          el('b', { text: mcOk ? 'Yes! Now prove it. ' : 'The answer is “' + q.answer + '”. Now find the proof. ' }),
          'Tap the ' + unit + ' in the text that shows this.');
        area.appendChild(instr);
        area.appendChild(msg);
        setText({ mode: 'sent', onSent: tap });
        revealText(0);
        try { instr.focus({ preventScroll: true }); } catch (e) {}
        function tap(u, node) {
          if (finished) return;
          if (tried.indexOf(node) >= 0) { msg.textContent = 'You have already tried that ' + unit + '. Pick a different one.'; return; }
          if (q.evidence.indexOf(u) >= 0) {
            finished = true;
            node.classList.add('is-correct');
            if (mcOk) api.correct(node); else api.sound('tap');
            done(mcOk, fb, q, el('p', { class: 'rd-msg', text: 'Evidence: “' + u + '”' }),
              mcOk ? null : 'Good detective work finding the proof, but the first answer slipped.');
            return;
          }
          tries++;
          tried.push(node);
          node.classList.add('is-wrong');
          api.wrong(node);
          later(function () { node.classList.remove('is-wrong'); }, 900);
          if (tries >= 2) {
            finished = true;
            // Highlight the first proof in the text and quote exactly what is highlighted.
            // In a poem, proof lines in the same verse belong together, so show them all.
            var hits = [].filter.call(tbody.querySelectorAll('.rd-s'), function (s) { return q.evidence.indexOf(s._u) >= 0; });
            var right = hits[0], group = [];
            if (right) {
              var row = right.closest('.rd-p');
              group = t.kind === 'poem' ? hits.filter(function (s) { return s.closest('.rd-p') === row; }) : [right];
              group.forEach(function (s) { s.classList.add('is-correct'); });
              scrollTextTo(right);
            }
            var quote = group.length ? group.map(function (s) { return s._u; }).join(' / ') : q.evidence[0];
            done(false, fb, q, el('p', { class: 'rd-msg', text: 'The proof is: “' + quote + '”' }),
              mcOk ? 'Right answer, but the proof got away this time.' : null);
          } else {
            msg.textContent = 'Not that one. Look for the ' + unit + ' that shows it most clearly. One more try!';
          }
        }
      }

      /* find and copy a word: tap it in the passage */
      function doWord(q, area, fb) {
        var tries = 0, finished = false, tried = [];
        var pp = norm(t.paras[q.para - 1]);
        var where = pp.step ? 'step (Step ' + pp.step + ')'
          : pp.h ? 'section, “' + pp.h + '” (number ' + q.para + ')'
          : (t.kind === 'poem' ? 'verse' : 'paragraph') + ' (number ' + q.para + ')';
        var msg = el('p', { class: 'rd-msg', role: 'status', 'aria-live': 'polite' });
        area.appendChild(el('div', { class: 'rd-instr' },
          el('b', { text: 'Word hunt! ' }),
          'Tap the word in the highlighted ' + where + '.'));
        area.appendChild(msg);
        setText({ mode: 'word', para: q.para, onWord: tap });
        revealText(q.para);
        function tap(c, node) {
          if (finished) return;
          if (tried.indexOf(node) >= 0) { msg.textContent = 'You have already tried that word. Pick a different one.'; return; }
          if (q.answer.indexOf(c.toLowerCase()) >= 0) {
            finished = true;
            node.classList.add('is-correct');
            api.correct(node);
            done(true, fb, q, el('p', { class: 'rd-msg', text: 'You found “' + c + '”.' }));
            return;
          }
          tries++;
          tried.push(node);
          node.classList.add('is-wrong');
          api.wrong(node);
          later(function () { node.classList.remove('is-wrong'); }, 900);
          if (tries >= 2) {
            finished = true;
            var right = null;
            [].some.call(tbody.querySelectorAll('.rd-w'), function (b) { if (q.answer.indexOf(b.textContent.toLowerCase()) >= 0) { right = b; return true; } return false; });
            if (right) { right.classList.add('is-correct'); scrollTextTo(right); }
            done(false, fb, q, el('p', { class: 'rd-msg', text: 'The word was “' + q.answer[0] + '”.' }));
          } else {
            msg.textContent = 'Not quite. Hint: the word begins with “' + q.answer[0].charAt(0) + '”. Try again!';
          }
        }
      }

      /* order these events: tap tokens in order */
      function doOrder(q, area, fb) {
        var items = q.items.slice(), pool = api.shuffle(items), placed = [], locked = false, tries = 0;
        while (tries++ < 12 && pool.join('|') === items.join('|')) pool = api.shuffle(items);
        var list = el('ol', { class: 'rd-order', 'aria-label': 'Your order' });
        var poolBox = el('div', { class: 'qi-row rd-pool', role: 'group', 'aria-label': 'Events still to place' });
        var check = el('button', { type: 'button', class: 'qi-btn', disabled: true, onclick: doCheck }, 'Check my order');
        var reset = el('button', { type: 'button', class: 'qi-btn secondary', onclick: function () { if (locked) return; pool = pool.concat(placed); placed = []; draw(true); } }, 'Start again');
        area.appendChild(el('p', { class: 'qi-sub', text: 'Tap the events in order, first one first. Tap a placed event to send it back.' }));
        area.appendChild(list);
        area.appendChild(poolBox);
        area.appendChild(el('div', { class: 'qi-row' }, check, reset));
        function token(it, isPlaced) {
          return el('button', { type: 'button', class: 'qi-token', onclick: function () {
            if (locked) return;
            api.sound('tap');
            if (isPlaced) { placed.splice(placed.indexOf(it), 1); pool.push(it); }
            else { pool.splice(pool.indexOf(it), 1); placed.push(it); }
            draw(true);
          } }, it);
        }
        function draw(refocus) {
          list.innerHTML = '';
          poolBox.innerHTML = '';
          for (var i = 0; i < items.length; i++) {
            list.appendChild(el('li', { class: 'rd-slot' },
              el('span', { class: 'rd-num', text: String(i + 1) }),
              i < placed.length ? token(placed[i], true) : el('span', { class: 'rd-blank' }, el('span', { class: 'rd-vh', text: 'empty' }))));
          }
          pool.forEach(function (it) { poolBox.appendChild(token(it, false)); });
          if (!pool.length) poolBox.appendChild(el('span', { class: 'qi-sub', text: 'All placed. Check your order!' }));
          check.disabled = pool.length > 0;
          if (refocus) {
            var f = poolBox.querySelector('.qi-token');
            try { (f || check).focus({ preventScroll: true }); } catch (e) {}
          }
        }
        function doCheck() {
          if (locked || pool.length) return;
          locked = true;
          check.disabled = true;
          reset.disabled = true;
          var ok = placed.every(function (it, i) { return it === items[i]; });
          [].forEach.call(list.querySelectorAll('.qi-token'), function (b, i) {
            b.classList.add(placed[i] === items[i] ? 'is-correct' : 'is-wrong');
            b.disabled = true;
          });
          if (ok) api.correct(list); else api.wrong(list);
          var extra = ok ? null : el('div', { class: 'rd-msg' },
            el('b', { text: 'The right order:' }),
            el('ol', { class: 'rd-correct' }, items.map(function (x) { return el('li', { text: x }); })));
          done(ok, fb, q, extra);
        }
        draw(false);
      }

      /* fact or opinion: tap a sentence, then tap a box */
      function doFO(q, area, fb) {
        var items = api.shuffle(q.items), where = {}, sel = null, locked = false;
        var poolBox = el('div', { class: 'rd-fopool', role: 'group', 'aria-label': 'Sentences to sort' });
        var check = el('button', { type: 'button', class: 'qi-btn', disabled: true, onclick: doCheck }, 'Check my sorting');
        function bin(key, name, sub) {
          var list = el('div', { class: 'rd-binlist' });
          var btn = el('button', { type: 'button', class: 'rd-binbtn', onclick: function (e) { e.stopPropagation(); place(key); } },
            el('b', { text: name }), el('span', { text: sub }));
          var d = el('div', { class: 'qi-drop rd-bin', onclick: function () { place(key); } }, btn, list);
          d._list = list;
          d._btn = btn;
          return d;
        }
        var binF = bin('F', 'Fact', 'Can be checked and proved true');
        var binO = bin('O', 'Opinion', 'What someone thinks or feels');
        area.appendChild(el('p', { class: 'qi-sub', text: 'Tap a sentence, then tap Fact or Opinion. You can move sentences until you press Check.' }));
        area.appendChild(poolBox);
        area.appendChild(el('div', { class: 'rd-bins' }, binF, binO));
        area.appendChild(el('div', { class: 'qi-row' }, check));
        function place(key) {
          if (locked || sel == null) return;
          where[sel] = key;
          sel = null;
          api.sound('tap');
          draw();
          var f = poolBox.querySelector('.qi-token');
          try { (f || check).focus({ preventScroll: true }); } catch (e) {}
        }
        function draw() {
          poolBox.innerHTML = '';
          binF._list.innerHTML = '';
          binO._list.innerHTML = '';
          var left = 0;
          items.forEach(function (it, i) {
            var b = el('button', { type: 'button', class: 'qi-token' + (sel === i ? ' is-selected' : ''), 'aria-pressed': String(sel === i), onclick: function (e) {
              e.stopPropagation();
              if (locked) return;
              sel = sel === i ? null : i;
              api.sound('tap');
              draw();
              if (sel != null) { try { binF._btn.focus({ preventScroll: true }); } catch (er) {} }
            } }, it.s);
            b._i = i;
            if (where[i] === 'F') binF._list.appendChild(b);
            else if (where[i] === 'O') binO._list.appendChild(b);
            else { poolBox.appendChild(b); left++; }
          });
          if (!left) poolBox.appendChild(el('span', { class: 'qi-sub', text: 'All sorted. Press Check!' }));
          binF.classList.toggle('is-target', sel != null);
          binO.classList.toggle('is-target', sel != null);
          check.disabled = left > 0;
        }
        function doCheck() {
          if (locked) return;
          locked = true;
          check.disabled = true;
          var ok = true;
          [binF, binO].forEach(function (d) {
            [].forEach.call(d._list.querySelectorAll('.qi-token'), function (b) {
              var it = items[b._i], right = (it.f ? 'F' : 'O') === where[b._i];
              if (!right) { ok = false; b.appendChild(el('span', { class: 'rd-tagfix', text: '(really ' + (it.f ? 'a fact' : 'an opinion') + ')' })); }
              b.classList.add(right ? 'is-correct' : 'is-wrong');
              b.disabled = true;
            });
            d._btn.disabled = true;
          });
          if (ok) api.correct(check); else api.wrong(area);
          done(ok, fb, q);
        }
        draw();
      }

      renderQ();
    }

    showMenu();

    return function cleanup() {
      dead = true;
      timers.forEach(clearTimeout);
      timers = [];
      hush();
      if (hasSpeech) { try { window.speechSynthesis.removeEventListener('voiceschanged', checkVoices); } catch (e) {} }
    };
  }

  var world = {
    id: 'reading',
    title: 'English Reading',
    subtitle: 'Story Lighthouse · Light the Lamp — Year 4 comprehension',
    source: 'Y4 Reading Comprehension',
    color: '#eba52f',
    badge: BADGE,
    start: start
  };
  world._test = { TEXTS: TEXTS, units: units, core: core, wordsIn: wordsIn, countWords: countWords, norm: norm, sceneSVG: sceneSVG };
  QuestIslands.register(world);
})();

</script>
<script>
/* world: french */
/* Quest Islands — Île des Sons (French CP reading, booklet n°2: sounds & spellings).
   Game "Chasse aux sons": bubble catch by SOUND, pick the right spelling, build words from
   syllables, read a sentence and choose. Content reworded from the booklet's word lists. */
(function () {
  'use strict';

  var N = 10; // questions per run

  /* ------------------------------------------------------------------ data
     Each family:
       T  bubble targets. yes: words that contain the sound, [..] marks the letters that make it.
          no: words without that sound. 'mot|note' = a trap word with a teaching note.
       G  spelling gaps: [text with _, answer, choices, emoji, optional rule]
       S  syllables:     [word, 'syl-la-bes', emoji, clue]
       L  read & choose: [sentence, question, choices (first one is right)]          */
  var FAM = [
    {
      id: 'an', name: 'an · am · en · em', icon: '🐘', desc: 'maman, lampe, tente, enfant',

        api.sound('tap');
        st.plan = buildPlan(st.fam);
        st.q = 0; st.score = 0;
        api.setScore(0);
        ask();
      }
      function ask() {
        var p = st.plan[st.q];
        if (p.t === 'B') qBubble(p);
        else if (p.t === 'G') qGraph(p);
        else if (p.t === 'S') qSyl(p);
        else qLis(p);
      }
      function end() {
        api.progress(N, N);
        api.finish({ score: st.score, max: N });
      }

      /* ---------- shared question frame ---------- */
      function frame(p, instr, hint) {
        clear();
        api.progress(st.q, N);
        var body = E('div', { class: 'wf-card' });
        var fb = E('p', { class: 'qi-feedback wf-fb', role: 'status', 'aria-live': 'polite' });
        var nav = E('div', { class: 'wf-nav' });
        host.appendChild(E('div', { class: 'qi-stack' },
          E('div', { class: 'wf-top' },
            E('span', { class: 'qi-eyebrow', text: 'Question ' + (st.q + 1) + ' / ' + N + ' · ' + TYPES[p.t].tag }),
            E('span', { class: 'qi-tag', text: p.f.icon + ' ' + p.f.name })),
          E('div', { class: 'qi-panel wf-card' },
            E('div', { class: 'wf-instr' },
              E('p', { class: 'qi-prompt', text: fr(instr) }),
              E('p', { class: 'wf-en', lang: 'en', text: hint })),
            body),
          E('div', { class: 'wf-after' }, fb, nav)));
        return { body: body, fb: fb, nav: nav };
      }
      function setFb(x, kind, main, extra) {
        x.fb.className = 'qi-feedback wf-fb' + (kind ? ' ' + kind : '');
        x.fb.innerHTML = '';
        x.fb.appendChild(document.createTextNode(fr(main)));
        if (extra) x.fb.appendChild(E('small', { text: fr(extra) }));
      }
      function done(x, ok, main, extra) {
        if (ok) st.score++;
        setFb(x, ok ? 'good' : 'bad', main, extra);
        var last = st.q >= N - 1;
        var nb = E('button', {
          type: 'button', class: 'qi-btn',
          onclick: function () {
            api.sound('tap');
            st.q++;
            if (st.q >= N) end(); else ask();
          }
        }, last ? 'Voir mon trésor 🏆' : 'Suivant ➜');
        x.nav.appendChild(nb);
        later(function () { try { nb.focus(); } catch (e) {} }, 80);
      }

      /* ---------- 1. bubble catch ---------- */
      function qBubble(p) {
        var T = p.item, lab = sndLabel(T);
        var x = frame(p,
          T.ins || ('Touche les bulles où tu entends le son ' + lab + '.'),
          T.en || ('Tap every bubble whose word has the sound “' + T.show + '”.'));
        var nYes = Math.random() < 0.5 ? 3 : 4;
        var yes = api.pick(T.yes, nYes);
        var traps = T.no.filter(function (w) { return noteOf(w); });
        var calm = T.no.filter(function (w) { return !noteOf(w); });
        var nNo = 7 - nYes;
        var nTrap = Math.min(traps.length, Math.random() < 0.5 ? 1 : 2);
        var no = api.pick(traps, nTrap).concat(api.pick(calm, nNo - nTrap));
        var words = api.shuffle(yes.map(function (w) { return { w: w, ok: true }; })
          .concat(no.map(function (w) { return { w: w, ok: false }; })));
        var found = 0, miss = 0, over = false;
        var sndEl = E('div', { class: 'wf-snd', 'aria-hidden': 'true', text: T.show });
        var count = E('p', { class: 'wf-count', 'aria-live': 'polite' });
        function upd() {
          var left = yes.length - found;
          count.textContent = fr(left > 1 ? ('🫧 Encore ' + left + ' bulles à attraper') : left === 1 ? '🫧 Encore 1 bulle !' : '🎉 Toutes trouvées !');
        }
        var mute = E('p', { class: 'wf-mute', hidden: true, text: fr('Pas de son ici : lis les mots tout seul, tu peux le faire !') });
        x.body.appendChild(E('div', { class: 'wf-target' },
          sndEl,
          E('div', { class: 'wf-snd-side' },
            E('p', null, fr(T.lab ? (T.lab + ', comme dans « ') : ('Le son ' + lab + ', comme dans « ')), E('strong', { text: T.ex[0] }), fr(' »')),
            E('div', { class: 'qi-row' }, speaker(T.ex.join(', '), 'Écouter', function () { mute.hidden = false; }), count),
            mute)));
        var sea = E('div', { class: 'wf-sea', role: 'group', 'aria-label': 'Bulles' });
        for (var r = 0; r < 6; r++) {
          sea.appendChild(E('span', { class: 'wf-rise', 'aria-hidden': 'true',
            style: { left: (8 + r * 16 + Math.random() * 6) + '%', animationDelay: (-r * 1.2) + 's', width: (8 + (r % 3) * 5) + 'px', height: (8 + (r % 3) * 5) + 'px' } }));
        }
        sea.appendChild(E('span', { class: 'wf-swimmer', 'aria-hidden': 'true', html: FISH }));
        var bubs = [];
        words.forEach(function (o, i) {
          var word = plain(o.w);
          var b = E('button', {
            type: 'button', class: 'wf-bub', 'aria-label': word,
            style: { animationDelay: (-(i * 0.47) % 3).toFixed(2) + 's', animationDuration: (2.8 + (i % 3) * 0.45).toFixed(2) + 's' },
            onclick: function () {
              if (over || b.disabled) return;
              say(word);
              focusNext(bubs, b);
              b.disabled = true;
              if (o.ok) {
                found++;
                b.classList.add('is-caught');
                b.innerHTML = '';
                hl(o.w).forEach(function (n) { b.appendChild(typeof n === 'string' ? document.createTextNode(n) : n); });
                api.sound('correct'); api.burst(b);
                setFb(x, 'good', T.hit ? T.hit.replace('{w}', word) : ('Oui ! Dans « ' + word + ' », on entend le son ' + lab + '.'));
                upd();
                if (found === yes.length) finishRound();
              } else {
                miss++;
                b.classList.add('is-miss');
                api.wrong(b);
                setFb(x, 'bad', noteOf(o.w) || (T.miss ? T.miss.replace('{w}', word) : ('Dans « ' + word + ' », on n’entend pas le son ' + lab + '.')));
              }
            }
          }, word);
          bubs.push(b);
          sea.appendChild(b);
        });
        x.body.appendChild(sea);
        upd();
        function finishRound() {
          over = true;
          bubs.forEach(function (b) { if (!b.disabled) { b.disabled = true; b.classList.add('is-rest'); } });
          if (miss === 0) {
            api.correct(sndEl);
            done(x, true, 'Bravo ! Tu as attrapé toutes les bonnes bulles, sans erreur.', 'À retenir : ' + T.spell + '.');
          } else {
            api.sound('flip');
            done(x, false, 'Tu as trouvé toutes les bulles, mais attention aux pièges (' + miss + ' erreur' + (miss > 1 ? 's' : '') + ').', 'À retenir : ' + T.spell + '.');
          }
        }
      }

      /* ---------- 2. which spelling ---------- */
      function qGraph(p) {
        var g = p.item, full = g[0].replace('_', g[1]);
        var x = frame(p, 'Choisis les bonnes lettres pour écrire le mot.', 'Pick the letters that spell the word correctly.');
        var parts = g[0].split('_');
        var gap = E('span', { class: 'wf-gap', text: '?' });
        var sr = E('span', { class: 'wf-sr', text: parts[0] + ' … ' + parts[1] });
        x.body.appendChild(E('div', { class: 'wf-clue' },
          E('span', { class: 'wf-emoji', 'aria-hidden': 'true', text: g[3] }),
          E('span', { class: 'wf-word', 'aria-hidden': 'true' }, parts[0], gap, parts[1]), sr,
          speaker(full)));
        var btns = [];
        var box = E('div', { class: 'wf-letters' }, api.shuffle(g[2]).map(function (c) {
          var b = E('button', {
            type: 'button', class: 'qi-choice',
            onclick: function () {
              btns.forEach(function (o) { o.disabled = true; if (o.textContent === g[1]) o.classList.add('is-correct'); });
              gap.textContent = g[1]; gap.classList.add('is-filled'); sr.textContent = full;
              say(full);
              var rule = g[4] || p.f.Gnote || '';
              if (c === g[1]) {
                api.correct(b);
                done(x, true, 'Oui ! On écrit « ' + full + ' » avec « ' + g[1] + ' ».', rule);
              } else {
                b.classList.add('is-wrong');
                api.wrong(b);
                done(x, false, 'Pas « ' + c + ' » ici : on écrit « ' + full + ' » avec « ' + g[1] + ' ».', rule);
              }
            }
          }, c);
          btns.push(b);
          return b;
        }));
        x.body.appendChild(box);
        later(function () { say(full); }, 350);
      }

      /* ---------- 3. syllables ---------- */
      function qSyl(p) {
        var s = p.item, word = s[0], syl = s[1].split('-');
        var x = frame(p, 'Touche les syllabes dans l’ordre pour écrire le mot.', 'Tap the syllables in the right order to build the word.');
        var extra = api.pick(sylDecoys(s, p.f), 1);
        var reveal = E('p', { class: 'wf-reveal', hidden: true, text: word });
        var see = E('button', { type: 'button', class: 'qi-btn secondary', onclick: function () { showWord(); } }, '👀 Voir le mot');
        function showWord() { reveal.hidden = false; see.hidden = true; }
        x.body.appendChild(E('div', { class: 'wf-sylclue' },
          E('span', { class: 'wf-emoji', 'aria-hidden': 'true', text: s[2] }),
          E('p', { text: fr(s[3]) }),
          E('div', { class: 'qi-row' }, speaker(word, 'Écouter', showWord), see),
          reveal));
        var slots = syl.map(function () { return E('span', { class: 'wf-slot' }); });
        var built = E('div', { class: 'wf-row', role: 'status', 'aria-live': 'polite' }, slots);
        var pos = 0, miss = 0, fin = false, toks = [];
        var row = E('div', { class: 'wf-row' }, api.shuffle(syl.concat(extra)).map(function (y) {
          var t = E('button', {
            type: 'button', class: 'qi-token wf-tok',
            onclick: function () {
              if (fin || t.disabled) return;
              if (y === syl[pos]) {
                slots[pos].textContent = y;
                slots[pos].classList.add('is-on', 'c' + (pos % 2));
                focusNext(toks, t);
                t.disabled = true;
                api.sound('tap');
                pos++;
                if (pos === syl.length) complete();
              } else {
                miss++;
                t.classList.add('is-wrong');
                api.wrong(t);
                setFb(x, 'bad', 'Pas encore « ' + y + ' ». Écoute bien le mot et cherche la syllabe suivante.');
                later(function () { t.classList.remove('is-wrong'); }, 650);
              }
            }
          }, y);
          toks.push(t);
          return t;
        }));
        x.body.appendChild(built);
        x.body.appendChild(row);
        function complete() {
          fin = true;
          toks.forEach(function (t) { t.disabled = true; });
          showWord();
          say(word);
          if (miss === 0) {
            api.correct(built);
            done(x, true, 'Bravo ! ' + syl.join(' + ') + ' = « ' + word + ' ».');
          } else {
            api.sound('flip');
            done(x, false, 'Le mot est « ' + word + ' » : ' + syl.join(' - ') + '. Regarde bien l’ordre des syllabes !');
          }
        }
        later(function () { if (!say(word)) showWord(); }, 350);
      }

      /* ---------- 4. read and choose ---------- */
      function qLis(p) {
        var l = p.item, right = l[2][0];
        var x = frame(p, 'Lis la phrase, puis réponds.', 'Read the sentence, then answer the question.');
        x.body.appendChild(E('div', { class: 'wf-sentence' }, E('p', { text: fr(l[0]) }), speaker(l[0])));
        x.body.appendChild(E('p', { class: 'qi-prompt', text: fr(l[1]) }));
        var btns = [];
        x.body.appendChild(E('div', { class: 'qi-choices wf-lis' }, api.shuffle(l[2]).map(function (c) {
          var b = E('button', {
            type: 'button', class: 'qi-choice',
            onclick: function () {
              btns.forEach(function (o) { o.disabled = true; if (o.textContent === right) o.classList.add('is-correct'); });
              if (c === right) {
                api.correct(b);
                done(x, true, 'Bravo, tu as bien lu !', '« ' + l[0] + ' »');
              } else {
                b.classList.add('is-wrong');
                api.wrong(b);
                done(x, false, 'Relis bien la phrase : la réponse est « ' + right.replace(/^[^A-Za-zÀ-ÿ]+/, '') + ' ».', '« ' + l[0] + ' »');
              }
            }
          }, c);
          btns.push(b);
          return b;
        })));
      }

      menu();

      return function cleanup() {
        dead = true;
        timers.forEach(clearTimeout);
        timers = [];
        try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
        host.innerHTML = '';
      };
    }
  });
})();

    '<circle cx="24" cy="53" r="3.6" fill="#ff8a7a" opacity=".65"/><circle cx="56" cy="53" r="3.6" fill="#ff8a7a" opacity=".65"/></svg>';

  /* ------------------------------------------------------------------ CSS (all under .w-nature) */

    '@media (max-width: 480px) { .w-nature .ev-exam { grid-template-columns: 84px 1fr; } .w-nature .ev-exam .ev-go { grid-column: 1 / -1; text-align: center; } }',

    '.w-nature .ev-wiggle { animation: evWiggle .6s ease; }',
    '.w-nature .ev-pulse { animation: evPulse 1.1s ease-in-out infinite; }',
    '@keyframes evBob { 50% { transform: translateY(-6px) rotate(-3deg); } }',
    '@keyframes evTalk { to { transform: scaleY(.4); } }',
    '@keyframes evFloat { 50% { transform: translateY(-6px); } }',
    '@keyframes evPulse { 50% { transform: scale(1.06); } }',
    '@keyframes evPop { 40% { transform: scale(1.18); } }',
    '@keyframes evWiggle { 25% { transform: rotate(-8deg); } 50% { transform: rotate(7deg); } 75% { transform: rotate(-4deg); } }',
    '@keyframes evToast { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }',
    '  75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%) scale(.95); } }'
  ].join('\n');

  function injectCss() {
    var old = document.getElementById('ev-css');
    if (old) old.remove();
    var s = document.createElement('style');
    s.id = 'ev-css';
    s.textContent = CSS + '\n' + stations.map(function (st) { return st.css || ''; }).join('\n');
    document.head.appendChild(s);
  }

  /* ------------------------------------------------------------------ the island */
  function start(root, api) {
    var el = api.el;
    var dead = false;
    var timers = [], intervals = [], stops = [], offs = [];
    var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    injectCss();

    function clearScreen() {
      timers.forEach(clearTimeout); timers = [];
      intervals.forEach(clearInterval); intervals = [];
      stops.forEach(function (f) { f(); }); stops = [];
      offs.forEach(function (f) { f(); }); offs = [];
      if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
    }

    /* coach bubble shared by every screen */
    var coachText = el('span', { text: '' });
    var coach = el('div', { class: 'ev-coach' },
      el('div', { class: 'ev-pip', html: PIP }),
      el('div', { class: 'ev-bubble', 'aria-live': 'polite' }, coachText,
        el('button', { type: 'button', class: 'ev-say', 'aria-label': 'Say it again', onclick: function () { say(coachText.textContent, true); } }, '🔁')));
    var lastSaid = '';
    function say(text, force) {
      text = String(text || '');
      coachText.textContent = text;
      lastSaid = text;
      coach.classList.remove('talking'); void coach.offsetWidth; coach.classList.add('talking');
      if (voiceOn || force) api.speak(speakable(text), 'en-GB');
    }

    function toast(text) {
      var t = el('div', { class: 'ev-toast', text: text });
      root.appendChild(t);
      var id = setTimeout(function () { t.remove(); }, 1150); timers.push(id);
    }

    function kitFor(st, body) {
      return {
        el: el, shuffle: shuffle, pick: pick, reduced: reduced, root: body,
        say: say,
        toast: toast,
        sound: api.sound,
        speak: function (t, lang) { return voiceOn ? api.speak(speakable(t), lang) : false; },
        burst: api.burst, shake: api.shake,
        correct: function (target) { api.correct(target); },
        wrong: function (target) { api.wrong(target); },
        progress: api.progress,
        scrollTop: api.scrollTop,
        alive: function () { return !dead; },
        after: function (ms, fn) { var id = setTimeout(function () { if (!dead) fn(); }, ms); timers.push(id); return id; },
        every: function (ms, fn) { var id = setInterval(function () { if (!dead) fn(); }, ms); intervals.push(id); return id; },
        cancel: function (id) { clearTimeout(id); clearInterval(id); },
        frame: function (fn) {
          var stopped = false, raf = 0;
          function loop(ts) { if (dead || stopped) return; if (fn(ts) === false) return; raf = requestAnimationFrame(loop); }
          raf = requestAnimationFrame(loop);
          var stop = function () { stopped = true; cancelAnimationFrame(raf); };
          stops.push(stop);
          return stop;
        },
        listen: function (target, ev, fn, opt) {
          target.addEventListener(ev, fn, opt);
          offs.push(function () { target.removeEventListener(ev, fn, opt); });
        },
        svg: function (markup, cls) { return el('div', { class: cls || '', html: markup }); },
        question: function (container, q, onDone) { renderQuestion(container, q, onDone, st); },
        color: st ? st.color : '#b06cf0'
      };
    }

    /* one exam-style question: big picture, big options, read aloud, teach on answer */
    function renderQuestion(container, q, onDone, st) {
      container.innerHTML = '';
      var answered = false, gotIt = false;
      var why = el('p', { class: 'ev-why', hidden: true });
      var next = el('button', { type: 'button', class: 'qi-btn', hidden: true }, 'Next ▶');
      var opts = (q.options || []).map(function (o) { return typeof o === 'string' ? { t: o } : o; });
      if (!q.keepOrder) opts = shuffle(opts);
      var answers = [].concat(q.answer);
      var buttons = opts.map(function (o) {
        var b = el('button', { type: 'button', class: 'ev-opt', 'aria-label': o.t },
          o.pic ? el('span', { class: 'pic', 'aria-hidden': 'true', html: o.pic }) : null,
          el('span', { text: o.t }));
        b.addEventListener('click', function () {
          if (answered) return;
          answered = true;
          var ok = gotIt = answers.indexOf(o.t) >= 0;
          buttons.forEach(function (x, i) {
            x.disabled = true;
            if (answers.indexOf(opts[i].t) >= 0) x.classList.add('is-correct');
          });
          if (ok) { api.correct(b); toast(pick(['Yes!', 'Super!', 'Great!', 'Brilliant!'], 1)[0]); }
          else { b.classList.add('is-wrong'); api.wrong(b); }
          why.className = 'ev-why ' + (ok ? 'good' : 'bad');
          why.textContent = (ok ? '✅ ' : '💡 The answer is ' + answers[0] + '. ') + (q.why || '');
          why.hidden = false;
          say((ok ? 'Yes! ' : 'Good try. The answer is ' + answers[0] + '. ') + (q.why || ''));
          next.hidden = false;
          next.focus({ preventScroll: true });
        });
        return b;
      });
      next.addEventListener('click', function () { api.sound('tap'); onDone(gotIt); });
      container.appendChild(el('div', { class: 'ev-card ev-q' },
        q.pic ? el('div', { class: 'ev-q-pic', 'aria-hidden': 'true', html: q.pic }) : null,
        el('p', { class: 'ev-q-text', text: q.q }),
        el('div', { class: 'ev-opts' }, buttons),
        why,
        el('div', { class: 'ev-next-row' }, next)));
      say(q.say || q.q);
    }

    /* ---------------- map ---------------- */
    function stepsDone(id) { var p = progress[id] || {}; return [p.learn, p.play, p.check]; }

    function showMap(intro) {
      clearScreen();
      api.progress(0, 1);
      root.innerHTML = '';
      root.style.removeProperty('--st');
      var cards = stations.map(function (st, i) {
        var d = stepsDone(st.id);
        return el('button', { type: 'button', class: 'ev-stop', style: { '--st': st.color },
          'aria-label': (i + 1) + '. ' + st.name + ', ' + st.topic, onclick: function () { api.sound('tap'); openStation(st); } },
          el('span', { class: 'ev-num', text: String(i + 1) }),
          el('span', { class: 'ev-orb', 'aria-hidden': 'true', text: st.emoji }),
          el('span', null,
            el('b', { text: st.name }),
            el('small', { text: st.topic }),
            el('span', { class: 'ev-dots', 'aria-hidden': 'true' },
              el('i', { class: d[0] ? 'on' : '', text: 'Explore' }),
              el('i', { class: d[1] ? 'on' : '', text: 'Play' }),
              el('i', { class: d[2] ? 'on' : '', text: 'Check' }))));
      });
      var exam = el('button', { type: 'button', class: 'ev-stop ev-exam', onclick: function () { api.sound('tap'); openExam(); } },
        el('span', { class: 'ev-orb', 'aria-hidden': 'true', text: '📝' }),
        el('span', null, el('b', { text: 'Exam Practice' }), el('small', { text: EXAM_QS + ' questions from every topic, just like the test.' })),
        el('span', { class: 'ev-go', 'aria-hidden': 'true', text: 'Start ▶' }));
      root.appendChild(el('div', { class: 'ev-wrap' },
        el('div', { class: 'ev-hero' }, el('h1', { text: 'Discovery Den' }), el('p', { text: 'Social Studies · EVS revision' })),
        coach,
        el('div', { class: 'ev-map' }, cards, exam)));
      var started = stations.filter(function (st) { return progress[st.id]; }).length;
      say(intro || (started
        ? 'Pick another place to explore. Or try Exam Practice!'
        : 'Hi, I am Pip! Tap a place to explore. I will read everything to you. Start with number 1!'));
    }

    /* ---------------- station run: Explore -> Play -> Check ---------------- */
    function openStation(st) {
      clearScreen();
      root.innerHTML = '';
      root.style.setProperty('--st', st.color);
      var p = progress[st.id] = progress[st.id] || {};
      var score = 0, max = 0;
      api.setScore(0);

      var stepEls = ['Explore', 'Play', 'Check'].map(function (n, i) {
        return el('span', null, el('b', { text: String(i + 1) }), el('span', { class: 'lbl', text: n }));
      });
      var voiceBtn = el('button', { type: 'button', class: 'ev-voice', 'aria-label': 'Read aloud on or off', text: voiceOn ? '🔊' : '🔇',
        onclick: function () { voiceOn = !voiceOn; voiceBtn.textContent = voiceOn ? '🔊' : '🔇'; if (!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel(); } });
      var body = el('div', { class: 'ev-body ev-' + st.id });
      var foot = el('div', { class: 'ev-next-row' });
      root.appendChild(el('div', { class: 'ev-wrap ev-run' },
        el('div', { class: 'ev-top' },
          el('button', { type: 'button', class: 'ev-back', onclick: function () { api.sound('tap'); showMap(); } }, '← Topics'),
          el('div', { class: 'ev-steps' }, stepEls),
          voiceBtn),
        el('div', { class: 'ev-title' }, el('span', { class: 'ev-orb', 'aria-hidden': 'true', text: st.emoji }),
          el('div', null, el('h2', { text: st.name }), el('small', { text: st.topic }))),
        coach,
        body,
        foot));

      function setStep(i) {
        stepEls.forEach(function (s, k) { s.className = k === i ? 'now' : (k < i ? 'done' : ''); });
        api.progress(i, 3);
      }
      function fresh() { clearScreen(); body.innerHTML = ''; foot.innerHTML = ''; api.scrollTop(); return kitFor(st, body); }

      function explore() {
        setStep(0);
        var kit = fresh();
        var go = el('button', { type: 'button', class: 'qi-btn' }, 'Play the game ▶');
        go.addEventListener('click', function () { api.sound('tap'); play(); });
        var skip = el('button', { type: 'button', class: 'ev-skip' }, 'Skip to the game');
        skip.addEventListener('click', function () { api.sound('tap'); play(); });
        foot.appendChild(skip);
        st.learn(body, kit, function () {
          if (dead) return;
          p.learn = true;
          foot.innerHTML = '';
          go.classList.add('ev-ready');
          foot.appendChild(go);
          toast('You learned it!');
        });
      }
      function play() {
        setStep(1);
        var kit = fresh();
        st.play(body, kit, function (s, m) {
          if (dead) return;
          p.play = true;
          score += s; max += m;
          api.setScore(score);
          var go = el('button', { type: 'button', class: 'qi-btn ev-ready' }, 'Check what you know ▶');
          go.addEventListener('click', function () { api.sound('tap'); check(); });
          foot.innerHTML = '';
          foot.appendChild(go);
        });
      }
      function check() {
        setStep(2);
        fresh();
        var qs = pick(st.exam, Math.min(CHECK_QS, st.exam.length)), i = 0;
        max += qs.length;
        var box = el('div'), count = el('p', { class: 'ev-count' });
        body.appendChild(el('div', { class: 'ev-q' }, count, box));
        (function ask() {
          if (i >= qs.length) {
            p.check = true;
            setStep(3);
            var id = setTimeout(function () { if (!dead) api.finish({ score: score, max: max }); }, 500); timers.push(id);
            return;
          }
          count.textContent = 'Question ' + (i + 1) + ' of ' + qs.length;
          renderQuestion(box, qs[i], function (ok) {
            if (ok) score++;
            i++; api.scrollTop(); ask();
          }, st);
        })();
      }
      explore();
    }

    /* ---------------- Exam Practice ---------------- */
    function openExam() {
      clearScreen();
      root.innerHTML = '';
      root.style.setProperty('--st', '#6a4bd6');
      api.setScore(0);
      var per = Math.max(1, Math.floor(EXAM_QS / Math.max(1, stations.length)));
      var qs = [];
      stations.forEach(function (st) { qs = qs.concat(pick(st.exam, per)); });
      var rest = shuffle([].concat.apply([], stations.map(function (st) { return st.exam; })).filter(function (q) { return qs.indexOf(q) < 0; }));
      qs = shuffle(qs.concat(rest.slice(0, Math.max(0, EXAM_QS - qs.length))));
      var i = 0, score = 0;
      var box = el('div'), count = el('p', { class: 'ev-count' });
      root.appendChild(el('div', { class: 'ev-wrap' },
        el('div', { class: 'ev-top' }, el('button', { type: 'button', class: 'ev-back', onclick: function () { api.sound('tap'); showMap(); } }, '← Topics')),
        el('div', { class: 'ev-title' }, el('span', { class: 'ev-orb', 'aria-hidden': 'true', text: '📝' }),
          el('div', null, el('h2', { text: 'Exam Practice' }), el('small', { text: 'Every topic, mixed up' }))),
        coach, count, box));
      (function ask() {
        api.progress(i, qs.length);
        if (i >= qs.length) {
          var id = setTimeout(function () { if (!dead) api.finish({ score: score, max: qs.length }); }, 400); timers.push(id);
          return;
        }
        count.textContent = 'Question ' + (i + 1) + ' of ' + qs.length;
        renderQuestion(box, qs[i], function (ok) { if (ok) score++; i++; api.scrollTop(); ask(); });
        box.firstChild.classList.add('ev-paper');
      })();
    }

    showMap();
    return function cleanup() {
      dead = true;
      clearScreen();
    };
  }

  QuestIslands.register({
    id: ID,
    title: 'Social Studies (EVS)',
    subtitle: 'Discovery Den · explore, play & practise — soils, senses, plants & matter',
    source: 'EVS posters',
    color: '#b06cf0',
    badge: BADGE,
    start: start,
    _test: { stations: function () { return stations; }, speakable: speakable }
  });
})();

      const order = balls.map((b, i) => i).sort((a, c) => balls[a].y - balls[c].y);
      const st = order.map((i) => ({ x: balls[i].x, y: balls[i].y }));
      const topY = Math.min(BASE - CONT[from].H, BASE - CONT[ti].H) - 40;
      const STG = 65, DUR = 560, TOT = STG * 11 + DUR;
      const apply = (t) => {
        order.forEach((bi, j) => {
          const e = EASE.io(clamp01((t - j * STG) / DUR)), s0 = st[j], d0 = B.pts[j], mx = (s0.x + d0.x) / 2;
          const q = (a, m, z) => (1 - e) * (1 - e) * a + 2 * (1 - e) * e * m + e * e * z;
          put(bi, q(s0.x, mx, d0.x), q(s0.y, topY, d0.y));
        });
        const fr = clamp01(t / TOT);
        level(from, A.level * (1 - fr));
        level(ti, B.level * fr);
      };
      const end = () => { busy = false; if (x.alive()) landed(ti); };
      if (kit.reduced) { apply(TOT); end(); return; }
      let t0 = null;
      kit.frame((ts) => {
        if (!x.alive()) return false;
        if (t0 === null) t0 = ts;
        const t = ts - t0;
        apply(Math.min(t, TOT));
        if (t >= TOT) { end(); return false; }
      });
    }));
    kit.say('Here is a liquid in a tall glass. It has 12 particles. Tap the bowl to pour it in!');
  }

  function chBlock(x) {
    const { kit, el, stage } = x;
    stage.appendChild(el('h3', { class: 'mx-h', text: 'The solid block' }));

    stage.appendChild(L.wrap);
    const blk = svgNode(NS, 'g', '<g class="mx-bob"><g class="mx-wobg">' + blockMarkup() + '</g></g>');
    L.mid.appendChild(blk);
    const bob = blk.firstChild, wob = bob.firstChild;
    let bx = 180, by = 74, inside = -1, busy = false, sq = false;
    const put = (px, py) => { bx = px; by = py; blk.setAttribute('transform', 'translate(' + f(px - 26) + ' ' + f(py - 52) + ')'); };
    put(bx, by);
    const vice = el('button', { type: 'button', class: 'mx-card mx-vice', 'aria-label': 'Squeeze the block', html: viceSvg() + '<span class="mx-cap">Tap: squeeze it!</span>' });
    stage.appendChild(vice);
    if (x.has('squeeze')) vice.classList.add('on');
    const MSG = [
      'Into the glass! The block keeps its own shape. A solid has a fixed shape.',
      'In the bowl, it is still the same square block. Its shape does not change.',
      'Bump! The block cannot get into the bottle. A solid cannot change its shape to fit. The liquid could!'
    ];
    const DONE = ' A solid has a fixed shape and a fixed volume!';
    function hint() {
      const left = ['glass', 'bowl', 'bottle'].filter((k) => !x.has(k));
      if (left.length) return ' Now try the ' + left[0] + '.';
      return x.has('squeeze') ? '' : ' Now tap the squeezer!';
    }
    function run(segs, end) {
      if (!segs.length) { end(); return; }
      const sg = segs.shift(), sx = bx, sy = by;
      tween(x, sg[2], sg[3], (p) => put(sx + (sg[0] - sx) * p, sy + (sg[1] - sy) * p), () => run(segs, end));
    }
    function landed(ci) {
      kit.sound(ci === 2 ? 'flip' : 'tap');

      if (busy) return;
      if (ci === inside) { kit.sound('tap'); kit.say('The block is already there. Tap another container!'); return; }

      bob.classList.remove('mx-bob');

      segs.push([tgt.x, tgt.y, 300 + (tgt.y - TRAVEL) * 1.2, 'in']);
      run(segs, () => { inside = ci; busy = false; if (x.alive()) landed(ci); });
    }));
    vice.addEventListener('click', () => {
      if (sq) return;

      vice.classList.add('sq', 'on');

      kit.say('Squeeze! The block does not get smaller. A solid is very hard to compress.' + (fin ? DONE : hint()));
    });

  function learn(root, kit, done) {
    const el = kit.el;
    const engine = makeEngine(kit);
    const CH = [
      { label: 'Matter', icon: '⚖️', need: ['mass', 'space'], build: chMatter },
      { label: 'Particles', icon: '🎉', need: ['solid', 'liquid', 'gas'], build: chParty },
      { label: 'Pour', icon: '🫗', need: ['shape', 'volume'], build: chPour },
      { label: 'Block', icon: '🧱', need: ['glass', 'bowl', 'bottle', 'squeeze'], build: chBlock },
      { label: 'Gas jar', icon: '🫙', need: ['spread'], build: chJar }
    ];
    const found = CH.map(() => ({}));
    let cur = -1, token = 0, finished = false;
    const nav = el('div', { class: 'mx-chaps' });
    const stage = el('div', { class: 'mx-stage' });
    const foot = el('div', { class: 'mx-foot' });
    root.appendChild(el('div', { class: 'mx-learn' }, nav, stage, foot));
    const complete = (i) => CH[i].need.every((k) => found[i][k]);
    const unlocked = (i) => { for (let j = 0; j < i; j++) if (!complete(j)) return false; return true; };

    function drawNav() {
      nav.innerHTML = '';
      CH.forEach((c, i) => {
        nav.appendChild(el('button', {
          type: 'button', class: 'mx-chap' + (i === cur ? ' now' : '') + (complete(i) ? ' done' : ''), disabled: !unlocked(i),
          'aria-label': (i + 1) + '. ' + c.label + (complete(i) ? ', done' : ''),
          onclick: () => { if (i !== cur) { kit.sound('tap'); open(i); } }
        }, el('span', { class: 'ic', 'aria-hidden': 'true', text: complete(i) ? '✅' : c.icon }), el('span', { class: 'lb', text: c.label })));
      });
    }
    function showNext(i) {
      foot.innerHTML = '';
      if (i < CH.length - 1) {
        foot.appendChild(el('button', { type: 'button', class: 'qi-btn ev-ready', onclick: () => { kit.sound('tap'); open(i + 1); } }, 'Next: ' + CH[i + 1].label + ' ▶'));
      }
    }
    function open(i) {
      cur = i;
      const my = ++token;
      stage.innerHTML = '';
      foot.innerHTML = '';
      drawNav();
      CH[i].build({
        kit, el, engine, stage,
        alive: () => my === token && kit.alive(),
        later: (ms, fn) => kit.after(ms, () => { if (my === token) fn(); }),
        has: (k) => !!found[i][k],
        find: (k) => {
          const was = complete(i);
          if (!found[i][k]) { found[i][k] = true; drawNav(); }
          const now = complete(i);
          if (now && !was && my === token) {
            showNext(i);
            if (!finished && CH.every((c, j) => complete(j))) { finished = true; done(); }
          }
          return now && !was;
        }
      });
      if (complete(i)) showNext(i);
      kit.scrollTop();
    }
    open(0);
  }
