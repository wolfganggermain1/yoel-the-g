<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<script>window.QUEST_HOST = 'ytg';</script>
</head>
<body>
<title>Quest Islands</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a night-sea chart. The hub is a grid of islands on deep water; each island opens a full-screen
   "paper" stage where its mini-game runs. One committed dark-sea look, paper cards for reading. */
:root {
  --sea: #0d2b45;
  --sea-2: #164266;
  --sea-3: #1f5a86;
  --paper: #f3f7f4;
  --paper-2: #e2ece6;
  --ink: #15263a;
  --muted: #5b6d7c;
  --sun: #ffc83d;
  --sun-ink: #4a3300;
  --coral: #ff6b57;
  --foam: #4fd1b0;
  --good: #1f9d6b;
  --bad: #d6453a;
  --world: var(--sun);
  --font-display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--sea);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  overflow-x: hidden;
}
button, input, select { font: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

/* ---------- hub ---------- */
.hub {
  position: relative;
  min-height: 100%;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(1200px 500px at 50% -10%, var(--sea-3), transparent 70%),
    var(--sea);
  overflow: hidden;
}
#waves { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .55; }
.hub-inner { position: relative; max-width: 1060px; margin: 0 auto; display: grid; gap: 28px; }
.hub-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.brand h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.4rem, 7vw, 4.2rem);
  line-height: .95;
  letter-spacing: -.01em;
  color: var(--sun);
  text-wrap: balance;
  text-shadow: 0 4px 0 #0a1f33;
}
.brand p { margin: 8px 0 0; max-width: 48ch; color: #b9d0e0; }
.chest {
  display: flex; align-items: center; gap: 12px;
  background: var(--sea-2); border: 2px solid var(--sea-3);
  border-radius: 999px; padding: 8px 18px 8px 10px;
}
.chest .star { width: 34px; height: 34px; }
.chest b { font-family: var(--font-display); font-size: 1.6rem; line-height: 1; color: var(--sun); font-variant-numeric: tabular-nums; }
.chest span { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: #b9d0e0; }

.islands { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 22px; }
.island {
  --world: var(--sun);
  position: relative; text-align: left; cursor: pointer;
  display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center;
  padding: 18px; border-radius: 26px;
  background: var(--sea-2);
  border: 2px solid var(--sea-3);
  background: linear-gradient(160deg, color-mix(in srgb, var(--world) 22%, var(--sea-2)), var(--sea-2) 70%);
  border: 2px solid color-mix(in srgb, var(--world) 45%, var(--sea-3));
  color: var(--paper);
  transition: transform .18s ease, box-shadow .18s ease;
  box-shadow: 0 8px 0 #071a2b;
}
.island:hover { transform: translateY(-4px) rotate(-.4deg); box-shadow: 0 12px 0 #071a2b; }
.island:active { transform: translateY(2px); box-shadow: 0 4px 0 #071a2b; }
.island .badge {
  width: 96px; height: 96px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--paper);
  background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--world) 60%, #fff) 0 55%, color-mix(in srgb, var(--world) 30%, var(--sea)) 56% 100%);
  animation: bob 4s ease-in-out infinite;
}
.island:nth-child(2n) .badge { animation-delay: -1.3s; }
.island:nth-child(3n) .badge { animation-delay: -2.6s; }
.island .badge svg { width: 70px; height: 70px; }
.island h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; line-height: 1.1; text-wrap: balance; }
.island .sub { margin: 4px 0 8px; font-size: .92rem; color: #c8dbe8; }
.island .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.island .src { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--sun); color: color-mix(in srgb, var(--world) 70%, #fff); }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 20px; height: 20px; }
.hub-foot { color: #8fb0c6; font-size: .85rem; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.linkish { background: none; border: 0; color: #b9d0e0; text-decoration: underline; cursor: pointer; padding: 4px; }
.sound-toggle { background: var(--sea-2); border: 2px solid var(--sea-3); color: var(--paper); border-radius: 999px; padding: 6px 14px; cursor: pointer; }

@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }

/* YTG platform: its round 56px Back button is fixed at top:16px left:16px over the game frame. */
html.host-ytg .hub { padding-top: 88px; }
html.host-ytg .stage-bar { padding-left: max(88px, env(safe-area-inset-left, 0px)); }

/* ---------- stage ---------- */
.stage {
  position: fixed; inset: 0; z-index: 20;
  display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr);
  background: var(--paper);
  background: color-mix(in srgb, var(--world) 14%, var(--paper));
  color-scheme: light;
  color: var(--ink);
}
.stage-bar {
  display: flex; align-items: center; gap: 12px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--sea); color: var(--paper);
  border-bottom: 4px solid var(--world);
}
.stage-bar h2 { margin: 0; flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { background: var(--sea-2); color: var(--paper); border: 2px solid var(--sea-3); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 700; }
.score-pill { display: flex; align-items: center; gap: 6px; background: var(--sun); color: var(--sun-ink); border-radius: 999px; padding: 4px 12px 4px 6px; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.score-pill svg { width: 22px; height: 22px; }
.score-pill.pop { animation: pop .35s ease; }
.progress { position: relative; height: 8px; background: var(--paper-2); }
.progress i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--world); transition: width .3s ease; }
.stage-scroll { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.world-root {
  max-width: 820px; margin: 0 auto;
  padding-block: 22px calc(48px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@keyframes pop { 50% { transform: scale(1.25) } }

/* ---------- shared kit for worlds (qi-*) ---------- */
.qi-stack { display: grid; gap: 16px; }
.qi-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.qi-panel { background: var(--paper); border: 2px solid var(--paper-2); border-radius: var(--r); padding: 20px; box-shadow: 0 6px 0 var(--paper-2); box-shadow: 0 6px 0 color-mix(in srgb, var(--world) 30%, var(--paper-2)); min-width: 0; }
.qi-h { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.1; color: var(--ink); text-wrap: balance; }
.qi-sub { margin: 0; color: var(--muted); }
.qi-eyebrow { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); color: color-mix(in srgb, var(--world) 55%, var(--ink)); }
.qi-prompt { margin: 0; font-size: clamp(1.15rem, 3.2vw, 1.45rem); font-weight: 700; line-height: 1.35; color: var(--ink); text-wrap: pretty; }
.qi-big { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 8vw, 3.2rem); line-height: 1.05; font-variant-numeric: tabular-nums; }
.qi-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.qi-choice {
  min-height: 56px; padding: 12px 16px; border-radius: 14px; cursor: pointer;
  background: #fff; color: var(--ink); text-align: left; font-size: 1.05rem; font-weight: 700;
  border: 2px solid var(--paper-2); box-shadow: 0 4px 0 var(--paper-2);
  transition: transform .12s ease, border-color .12s ease, background .12s ease;
}
.qi-choice:hover:not(:disabled) { border-color: var(--world); transform: translateY(-2px); }
.qi-choice:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--paper-2); }
.qi-choice.is-selected { border-color: var(--sea-3); background: #e8f1fb; box-shadow: 0 4px 0 var(--sea-3); }
.qi-choice.is-correct { border-color: var(--good); background: #dcf5e9; box-shadow: 0 4px 0 var(--good); }
.qi-choice.is-wrong { border-color: var(--bad); background: #fde3e0; box-shadow: 0 4px 0 var(--bad); }
.qi-choice:disabled { cursor: default; }
.qi-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 10px 22px; border-radius: 999px; cursor: pointer;
  background: var(--sun); color: var(--sun-ink); border: 0; box-shadow: 0 5px 0 #c98f00;
  font-family: var(--font-display); font-weight: 800; font-size: 1.15rem;
  transition: transform .12s ease, box-shadow .12s ease;
}
.qi-btn:hover { transform: translateY(-2px); }
.qi-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c98f00; }
.qi-btn.secondary { background: #fff; color: var(--ink); box-shadow: 0 5px 0 var(--paper-2); border: 2px solid var(--paper-2); }
.qi-btn:disabled { opacity: .5; cursor: default; transform: none; }
.qi-input {
  min-height: 56px; width: 100%; max-width: 260px; padding: 8px 16px; border-radius: 14px;
  border: 3px solid var(--paper-2); background: #fff; color: var(--ink);
  font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums;
}
.qi-input:focus { border-color: var(--world); outline: none; }
.qi-tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--paper-2); color: var(--ink); font-size: .82rem; font-weight: 700; }
.qi-feedback { min-height: 1.5em; font-weight: 700; }
.qi-feedback.good { color: var(--good); }
.qi-feedback.bad { color: var(--bad); }
.qi-menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.qi-mode {
  text-align: left; cursor: pointer; padding: 16px; border-radius: var(--r);
  background: #fff; color: var(--ink); border: 2px solid var(--paper-2); box-shadow: 0 5px 0 var(--paper-2);
  display: grid; gap: 4px; transition: transform .12s ease, border-color .12s ease;
}
.qi-mode:hover { transform: translateY(-3px); border-color: var(--world); }
.qi-mode b { font-family: var(--font-display); font-size: 1.2rem; line-height: 1.15; }
.qi-mode span { color: var(--muted); font-size: .92rem; }
.qi-token {
  display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px; border-radius: 12px; cursor: pointer;
  background: #fff; color: var(--ink); border: 2px solid var(--paper-2); box-shadow: 0 3px 0 var(--paper-2); font-weight: 700;
  touch-action: manipulation; user-select: none;
}
.qi-token.is-selected { border-color: var(--world); background: #fff8e0; background: color-mix(in srgb, var(--world) 22%, #fff); transform: translateY(-2px); }
.qi-token.is-correct { border-color: var(--good); background: #dcf5e9; }
.qi-token.is-wrong { border-color: var(--bad); background: #fde3e0; }
.qi-drop {
  min-height: 84px; padding: 12px; border-radius: var(--r);
  border: 3px dashed var(--muted); background: #fff;
  border: 3px dashed color-mix(in srgb, var(--world) 50%, var(--paper-2)); background: color-mix(in srgb, var(--world) 7%, #fff);
  display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; cursor: pointer; min-width: 0;
}
.qi-drop.is-target { border-style: solid; border-color: var(--world); background: #fff8e0; background: color-mix(in srgb, var(--world) 16%, #fff); }
.qi-shake { animation: shake .4s ease; }
@keyframes shake { 20% { transform: translateX(-6px) } 40% { transform: translateX(6px) } 60% { transform: translateX(-4px) } 80% { transform: translateX(4px) } }

/* ---------- results ---------- */
.results { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(13, 43, 69, .8); }
.results-card { width: min(100%, 420px); background: var(--paper); color: var(--ink); border-radius: 28px; padding: 28px 24px; text-align: center; display: grid; gap: 14px; box-shadow: 0 10px 0 #071a2b; animation: rise .35s ease; }
.results-card h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1; }
.results-card .big-stars { display: flex; justify-content: center; gap: 8px; }
.results-card .big-stars svg { width: 64px; height: 64px; }
.results-card .big-stars svg.on { animation: starIn .5s ease backwards; }
.results-card .big-stars svg:nth-child(2) { animation-delay: .15s; }
.results-card .big-stars svg:nth-child(3) { animation-delay: .3s; }
.results-card .qi-row { justify-content: center; }
@keyframes rise { from { transform: translateY(30px); opacity: 0 } }
@keyframes starIn { from { transform: scale(0) rotate(-90deg) } }

.burst { position: fixed; z-index: 60; pointer-events: none; width: 10px; height: 10px; border-radius: 3px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="hub" id="hub">
  <canvas id="waves" aria-hidden="true"></canvas>
  <div class="hub-inner">
    <header class="hub-head">
      <div class="brand">
        <h1>Quest Islands</h1>
        <p>Six islands, one for each revision booklet. Sail to an island, play its game, and fill your treasure chest with stars.</p>
      </div>
      <div class="chest">
        <svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--sun)" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
        <div><b id="total-stars">0</b><br><span id="total-of">of 18 stars</span></div>
      </div>
    </header>
    <nav class="islands" id="islands" aria-label="Islands"></nav>
    <footer class="hub-foot">
      <button class="sound-toggle" id="sound-toggle" type="button">Sound: on</button>
      <button class="linkish" id="reset" type="button">Reset my stars</button>
    </footer>
  </div>
</div>

<section class="stage" id="stage" hidden>
  <div>
    <div class="stage-bar">
      <button class="back" id="back" type="button">&larr; Map</button>
      <h2 id="stage-title"></h2>
      <div class="score-pill" id="score-pill" role="status" aria-label="Score: 0">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--sun-ink)" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
        <span id="score">0</span>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><i id="progress"></i></div>
  </div>
  <div class="stage-scroll" id="stage-scroll"><div class="world-root" id="world-root"></div></div>
</section>

<div class="results" id="results" hidden>
  <div class="results-card" role="dialog" aria-modal="true" aria-labelledby="results-title">
    <div class="big-stars" id="results-stars"></div>
    <h3 id="results-title">Island cleared!</h3>
    <p id="results-text" style="margin:0"></p>
    <div class="qi-row">
      <button class="qi-btn" id="again" type="button">Play again</button>
      <button class="qi-btn secondary" id="to-map" type="button">Back to map</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  if (window.QUEST_HOST === 'ytg') document.documentElement.classList.add('host-ytg');
  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
  var worlds = [];
  var KEY = 'quest-islands-v1';
  var state = load();
  var current = null;   // { world, cleanup, score }

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || { best: {}, sound: true }; }
    catch (e) { return { best: {}, sound: true }; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function $(id) { return document.getElementById(id); }

  /* ---------- sound (synthesised, no files) ---------- */
  var ctx = null;
  function tone(freq, start, dur, type, vol) {
    if (!state.sound) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state !== 'running' && ctx.resume) ctx.resume();   // iOS suspends/interrupts after lock or app switch
      var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + start;
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }
  var SOUNDS = {
    tap: function () { tone(660, 0, .08, 'triangle', .08); },
    correct: function () { tone(660, 0, .12, 'triangle'); tone(990, .1, .2, 'triangle'); },
    wrong: function () { tone(220, 0, .18, 'sawtooth', .07); tone(180, .12, .22, 'sawtooth', .06); },
    win: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * .12, .3, 'triangle'); }); },
    flip: function () { tone(440, 0, .06, 'square', .05); }
  };
  function sound(name) { (SOUNDS[name] || SOUNDS.tap)(); }

  /* ---------- speech ---------- */
  // Clear teaching voices first; Apple's novelty voices (Grandpa, Rocko…) last. fr-CA only if no fr-FR exists.
  var PREFERRED = {
    fr: ['Thomas', 'Audrey', 'Aurélie', 'Marie', 'Google français', 'Microsoft Denise', 'Microsoft Henri', 'Microsoft Julie', 'Microsoft Paul', 'Jacques'],
    en: ['Daniel', 'Kate', 'Serena', 'Stephanie', 'Arthur', 'Martha', 'Google UK English Female', 'Google UK English Male', 'Microsoft Libby', 'Microsoft Sonia', 'Microsoft Hazel', 'Microsoft George']
  };
  var NOVELTY = /^(grandma|grandpa|rocko|eddy|flo|reed|sandy|shelley|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|ralph|kathy)\b/i;
  function bestVoice(lang) {
    var voices = speechSynthesis.getVoices(), base = lang.slice(0, 2), names = PREFERRED[base] || [];
    function score(x) {
      var l = (x.lang || '').replace('_', '-').toLowerCase(), s = 1000;
      if (l.indexOf(lang.toLowerCase()) === 0) s += 100; else if (l.indexOf(base) === 0) s += 10; else return -1;
      var i = names.findIndex(function (n) { return x.name.indexOf(n) === 0; });
      if (i >= 0) s += 50 - i;
      // On-device voices keep working offline; network voices (e.g. Chrome's "Google …") don't.
      if (x.localService) s += navigator.onLine === false ? 200 : 60;
      if (NOVELTY.test(x.name)) s -= 500;   // only if nothing else in this language exists
      return s;
    }
    var best = null, bestS = -1;
    voices.forEach(function (x) { var s = score(x); if (s > bestS) { best = x; bestS = s; } });
    return best;
  }
  function speak(text, lang) {
    if (!('speechSynthesis' in window)) return false;
    try {
      lang = lang || 'en-GB';
      var v = bestVoice(lang);
      // Voices loaded but none in this language: report failure so worlds show text instead.
      if (!v && speechSynthesis.getVoices().length) return false;
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = lang.indexOf('fr') === 0 ? 0.8 : 0.95;
      if (v) u.voice = v;
      if (speechSynthesis.speaking || speechSynthesis.pending) {
        // Some engines drop an utterance queued straight after cancel().
        speechSynthesis.cancel();
        setTimeout(function () { speechSynthesis.speak(u); }, 60);
      } else speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }
  if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); } catch (e) {} }

  /* ---------- effects ---------- */
  function burst(el) {
    var r = el && el.getBoundingClientRect ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;

  function buildRun(mode) {
    var N = 10;
    var pool = mode === 'mixed' ? BANK : BANK.filter(function (q) { return q.topic === mode; });
    var inter = shuffle(pool.filter(isInter));
    var quick = shuffle(pool.filter(function (q) { return !isInter(q); }));
    var chosen = [], seen = {}, used = {}, nInter = 0;
    /* at most one item per linked group, and one label item per diagram */
    function ok(q) {
      return chosen.indexOf(q) < 0 && !(q.group && used['g:' + q.group]) &&
        !(q.type === 'label' && used['d:' + q.diagram]);
    }
    function take(q) {
      chosen.push(q);
      if (q.group) used['g:' + q.group] = 1;
      if (q.type === 'label') used['d:' + q.diagram] = 1;
    }
    inter.forEach(function (q) { if (nInter < 4 && !seen[q.type] && ok(q)) { seen[q.type] = 1; take(q); nInter++; } });
    inter.forEach(function (q) { if (nInter < 4 && ok(q)) { take(q); nInter++; } });
    quick.forEach(function (q) { if (chosen.length < N && ok(q)) take(q); });
    if (chosen.length < N) {
      shuffle(BANK.filter(function (q) { return !isInter(q); }))
        .forEach(function (q) { if (chosen.length < N && ok(q)) take(q); });
    }
    var all = shuffle(chosen);
    var fi = -1;
    for (var i = 0; i < all.length; i++) { if (!isInter(all[i])) { fi = i; break; } }
    if (fi > 0) { var t = all[0]; all[0] = all[fi]; all[fi] = t; }
    return all;
  }

  function petals(cx, cy, dist, rx, ry, n, fill, stroke) {
    var s = '<g fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5">';
    for (var i = 0; i < n; i++) {
      s += '<ellipse cx="' + cx + '" cy="' + (cy - dist) + '" rx="' + rx + '" ry="' + ry +
           '" transform="rotate(' + (i * 360 / n) + ' ' + cx + ' ' + cy + ')"/>';
    }
    return s + '</g>';
  }

  function fluff(cx, cy) {
    var s = '<circle cx="' + cx + '" cy="' + cy + '" r="21" fill="#ffffff" fill-opacity=".75"/>';
    s += '<g stroke="#cfc4a0" stroke-width="1.2" stroke-linecap="round">';
    for (var i = 0; i < 12; i++) {
      var a = i * Math.PI / 6, x = cx + Math.sin(a) * 18, y = cy - Math.cos(a) * 18;
      s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>';
    }
    s += '</g><g fill="#ffffff" stroke="#d8cfae" stroke-width="1">';
    for (var k = 0; k < 12; k++) {
      var b = k * Math.PI / 6, px = cx + Math.sin(b) * 19, py = cy - Math.cos(b) * 19;
      s += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="3"/>';
    }
    return s + '</g><circle cx="' + cx + '" cy="' + cy + '" r="6" fill="#b58a4c"/>';
  }

    '.w-y3science .gg-pin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border-radius:50%;border:3px solid var(--gg-deep);background:#fff;color:var(--ink);font-family:var(--font-display);font-weight:800;font-size:1.2rem;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 3px 0 rgba(21,38,58,.18)}',
    '.w-y3science .gg-pin.filled{background:#c9f0d6}',
    '.w-y3science .gg-pin.armed{animation:gg-pulse 1s ease-in-out infinite}',
    '@keyframes gg-pulse{50%{box-shadow:0 0 0 7px rgba(63,191,106,.35)}}',
    '.w-y3science .gg-pin.is-correct{background:#dcf5e9;border-color:var(--good)}',
    '.w-y3science .gg-pin.is-wrong{background:#fde3e0;border-color:var(--bad)}',
    '.w-y3science .gg-slots{display:grid;gap:8px}',
    '.w-y3science .gg-slot{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:6px 10px;border-radius:12px;border:2px dashed color-mix(in srgb,var(--world) 55%,var(--paper-2));background:#fff;color:var(--ink);text-align:left;font-weight:700;font-size:.98rem;line-height:1.25;cursor:pointer}',
    '.w-y3science .gg-slot.filled{border-style:solid}',
    '.w-y3science .gg-slot:disabled{cursor:default}',
    '.w-y3science .gg-letter{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--gg-deep);color:#fff;font-family:var(--font-display);font-weight:800}',
    '.w-y3science .gg-empty{color:var(--muted);font-weight:400;font-style:italic}',
    '.w-y3science .gg-slot.is-correct{border-color:var(--good);background:#dcf5e9}',
    '.w-y3science .gg-slot.is-wrong{border-color:var(--bad);background:#fde3e0}',
    '.w-y3science .gg-fix{display:block;margin-top:2px;font-size:.85rem;font-weight:700;color:#a8261d}',
    '.w-y3science .gg-mark{flex:none;margin-left:6px;font-weight:800;font-size:1.1rem}',
    '.w-y3science .gg-slot .gg-mark{margin-left:auto}',
    '.w-y3science .gg-zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}',
    '.w-y3science .gg-zone{flex-direction:column;flex-wrap:nowrap;align-items:stretch}',
    '.w-y3science .gg-zonehead{min-height:44px;padding:0 4px;border:0;background:none;color:var(--gg-deep);font-family:var(--font-display);font-weight:800;font-size:1.1rem;text-align:left;cursor:pointer}',
    '.w-y3science .gg-zonehead:disabled{cursor:default}',
    '.w-y3science .gg-zone .qi-token{width:100%}',
    '.w-y3science .gg-order{list-style:none;margin:0;padding:0;display:grid;gap:8px}',
    '.w-y3science .gg-answer{margin:0;padding-left:1.4em;line-height:1.45}',
    '.w-y3science .gg-why{margin:0;line-height:1.45}',
    '.w-y3science .gg-why b{color:var(--gg-deep)}',
    '.w-y3science .gg-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}',
    '.w-y3science .gg-cele{display:grid;gap:12px;justify-items:center;text-align:center;background:linear-gradient(180deg,var(--gg-sky),#fff 70%)}',
    '.w-y3science .gg-cele .gg-plantbox{max-width:250px}',
    '.w-y3science .gg-score{margin:0;font-weight:700}'
  ].join('\n');

  function injectCSS() {
    if (document.getElementById('w-y3science-css')) return;
    var s = document.createElement('style');
    s.id = 'w-y3science-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  var PRAISE = ['Brilliant!', 'Spot on!', 'Green fingers!', 'Blooming marvellous!', 'Super sprouting!', 'Fantastic!', 'Well done!'];
  /* the chosen seed packet survives "Play again" (start() runs again) for this page session */
  var lastMode = 'mixed';
  function reducedMotion() {
    try { return typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
  }

  var DROOP = ['Oh dear, I\'m drooping... read the tip!', 'A rain cloud! Let\'s learn from that one.', 'I\'m wilting a bit. Check the explanation.'];

  /* ------------------------------------------------------------------ */
  /* world                                                               */
  /* ------------------------------------------------------------------ */
  QuestIslands.register({
    id: ID,
    title: 'Science — Year 3',
    subtitle: 'Greenhouse Grove · Grow-a-Plant — plants',
    source: 'Y3 Science tests',
    color: '#3fbf6a',
    badge: BADGE,
    _test: { bank: BANK, diagrams: DIAGRAMS, modes: MODES, stages: STAGES, buildRun: buildRun },
    start: function (root, api) {
      injectCSS();
      var h = api.el;
      var timers = [], dead = false, bubbleTimer = null, fxTimer = null;
      var mode = lastMode;
      var run = null, plantSvg = null, G = null, qPanel = null;
      var readyAt = 0;   /* clicks before this time are ignored (double-tap guard) */

      function later(fn, ms) {
        var id = setTimeout(function () { if (!dead) fn(); }, ms);
        timers.push(id);
        return id;
      }
      function clearTimers() { timers.forEach(clearTimeout); timers = []; bubbleTimer = null; fxTimer = null; }
      function each(list, fn) { Array.prototype.forEach.call(list, fn); }
      function lockAll(scope) { each(scope.querySelectorAll('button'), function (b) { b.disabled = true; }); }
      function guardClicks(el) {
        el.addEventListener('click', function (e) {
          if (Date.now() < readyAt) { e.stopPropagation(); e.preventDefault(); }
        }, true);
      }
      function focusQuiet(el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }

      function growTo(svg, target, step, delay) {
        setStage(svg, 0);
        for (var k = 1; k <= target; k++) {
          (function (k) { later(function () { setStage(svg, k); }, delay + step * k); })(k);
        }
      }

      /* ---------- start screen ---------- */
      function showStart() {
        clearTimers();
        root.innerHTML = '';
        api.progress(0, 1);
        api.setScore(0);
        api.scrollTop();
        var hero = h('div', { class: 'gg-plantbox', html: plantSVG() });
        var menu = h('div', { class: 'qi-menu', role: 'group', 'aria-label': 'Choose a topic' });
        MODES.forEach(function (m) {
          var b = h('button', {
            type: 'button', class: 'qi-mode' + (m.id === mode ? ' is-on' : ''), 'aria-pressed': String(m.id === mode),
            onclick: function () {
              mode = lastMode = m.id; api.sound('tap');
              each(menu.children, function (c) {
                var on = c === b; c.classList.toggle('is-on', on); c.setAttribute('aria-pressed', String(on));
              });
            }
          }, h('b', { text: m.name }), h('span', { text: m.desc }));
          menu.appendChild(b);
        });
        var play = h('button', { type: 'button', class: 'qi-btn', onclick: begin }, 'Plant my seed!');
        root.appendChild(h('div', { class: 'qi-stack' },
          h('div', { class: 'qi-panel gg-hero' }, hero,
            h('div', null,
              h('div', { class: 'qi-eyebrow', text: 'Year 3 science · Plants' }),
              h('h2', { class: 'gg-title', text: 'Greenhouse Grove' }),
              h('p', { class: 'gg-hook', text: 'Gardener Gwen has planted a magic seed in the greenhouse. Every right answer helps it grow: roots, shoot, leaves, a flower and seeds. Get all 10 right to grow a Super Bloom!' }))),
          h('div', { class: 'qi-panel qi-stack' },
            h('h3', { class: 'qi-h', text: 'Pick a seed packet' }),
            menu,
            h('div', { class: 'gg-chips', role: 'group', 'aria-label': 'Kinds of challenge' },
              ['Quick pick', 'True or false', 'Label it', 'Sort it', 'Order it'].map(function (t) { return h('span', { class: 'qi-tag', text: t }); })),
            h('div', { class: 'qi-row gg-go' }, play))));
        growTo(hero.querySelector('svg'), 8, 220, 250);
      }

      function begin() {
        api.sound('tap');
        clearTimers();
        run = { items: buildRun(mode), i: 0, score: 0 };
        api.setScore(0);
        api.progress(0, run.items.length);
        renderGame();
        showQuestion();
      }

      /* ---------- garden ---------- */
      function renderGame() {
        root.innerHTML = '';
        var box = h('div', { class: 'gg-plantbox', html: plantSVG() });
        plantSvg = box.querySelector('svg');
        G = {
          name: h('div', { class: 'gg-stagename' }),
          fact: h('p', { class: 'gg-fact' }),
          pips: h('div', { class: 'gg-pips', 'aria-hidden': 'true' }),
          bubble: h('div', { class: 'gg-bubble', 'aria-hidden': 'true' })
        };
        var garden = h('aside', { class: 'qi-panel gg-garden', 'aria-label': 'Your plant' },
          box, h('div', { class: 'qi-eyebrow', text: 'Your plant' }), G.name, G.fact, G.pips, G.bubble);
        qPanel = h('section', { class: 'qi-panel gg-q' });
        guardClicks(qPanel);
        root.appendChild(h('div', { class: 'gg-game' }, garden, qPanel));
        setStage(plantSvg, 0);
        updateGarden();
      }

      function updateGarden() {
        var s = Math.min(run.score, 10);
        G.name.textContent = 'Stage: ' + STAGES[s].name;
        G.fact.textContent = STAGES[s].fact;
        G.pips.innerHTML = '';
        for (var i = 0; i < run.items.length; i++) G.pips.appendChild(h('i', { class: i < run.score ? 'on' : '' }));
      }

      function bubble(kind, text) {
        G.bubble.className = 'gg-bubble show ' + kind;
        G.bubble.innerHTML = kind === 'sun' ? SUN_ICON : CLOUD_ICON;
        G.bubble.appendChild(h('span', { text: text }));
        if (bubbleTimer) clearTimeout(bubbleTimer);
        bubbleTimer = later(function () { G.bubble.classList.remove('show'); }, 2600);
      }

      function weather(cls, ms) {
        plantSvg.classList.remove('gg-sunny', 'gg-rainy', 'gg-droop');
        void plantSvg.getBoundingClientRect();
        cls.forEach(function (c) { plantSvg.classList.add(c); });
        if (fxTimer) clearTimeout(fxTimer);
        fxTimer = later(function () { plantSvg.classList.remove('gg-sunny', 'gg-rainy', 'gg-droop'); }, ms);
      }

      /* ---------- questions ---------- */
      function showQuestion() {
        var item = run.items[run.i];
        var N = run.items.length;
        api.scrollTop();
        readyAt = Date.now() + 300;
        qPanel.innerHTML = '';
        var ctx = {
          item: item, answered: false,
          fb: h('div', { class: 'qi-feedback', role: 'status' }),
          why: h('p', { class: 'gg-why' }),
          actions: h('div', { class: 'gg-actions' }),
          body: h('div', { class: 'qi-stack' })
        };
        qPanel.appendChild(h('div', { class: 'gg-qhead' },
          h('span', { class: 'qi-tag gg-mech', text: MECH[item.type] }),
          h('span', { class: 'gg-count', text: 'Question ' + (run.i + 1) + ' of ' + N })));
        if (item.type === 'tf') qPanel.appendChild(h('p', { class: 'gg-help', text: 'Is this sentence true or false?' }));
        var prompt = h('p', { class: 'qi-prompt', tabindex: '-1', text: item.type === 'tf' ? '“' + item.q + '”' : item.q });
        qPanel.appendChild(prompt);
        qPanel.appendChild(ctx.body);
        qPanel.appendChild(ctx.fb);
        qPanel.appendChild(ctx.why);
        qPanel.appendChild(ctx.actions);
        if (item.type === 'mc' || item.type === 'tf') bodyChoice(ctx);
        else if (item.type === 'label') bodyLabel(ctx);
        else if (item.type === 'sort') bodySort(ctx);
        else bodyOrder(ctx);
        focusQuiet(prompt);
      }

      function resolve(ctx, ok, target, lead) {
        if (ctx.answered) return;
        ctx.answered = true;
        var last = run.i + 1 >= run.items.length;
        if (ok) {
          run.score++;
          api.correct(target);
          var s = Math.min(run.score, 10);
          setStage(plantSvg, s);
          updateGarden();
          weather(['gg-sunny'], 1300);
          bubble('sun', STAGES[s].say || 'Thank you!');
          ctx.fb.className = 'qi-feedback good';
          ctx.fb.textContent = PRAISE[Math.floor(Math.random() * PRAISE.length)] + ' Your plant grew: ' + STAGES[s].name + '.';
        } else {
          api.wrong(target);
          weather(['gg-rainy', 'gg-droop'], 1600);
          bubble('cloud', run.score === 0 ? 'A rain cloud! Let\'s learn from that one.' : DROOP[Math.floor(Math.random() * DROOP.length)]);
          ctx.fb.className = 'qi-feedback bad';
          ctx.fb.textContent = lead;
        }
        ctx.why.innerHTML = '';
        ctx.why.appendChild(h('b', { text: 'Why? ' }));
        ctx.why.appendChild(document.createTextNode(ctx.item.why));
        api.progress(run.i + 1, run.items.length);
        ctx.actions.innerHTML = '';
        var next = h('button', { type: 'button', class: 'qi-btn', onclick: function () {
          if (ctx.moved) return;
          ctx.moved = true;
          api.sound('tap');
          run.i++;
          if (run.i >= run.items.length) celebrate(); else showQuestion();
        } }, last ? 'See my plant!' : 'Next →');
        ctx.actions.appendChild(next);
        focusQuiet(next);
        if (next.scrollIntoView) {
          try { next.scrollIntoView({ block: 'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' }); } catch (e) { next.scrollIntoView(false); }
        }
      }

      function partialLead(right, total) {
        if (right === 0) return 'Not this time. The ✗ ones are in the wrong place.';
        return (right < total / 2 ? 'Good try! ' : 'Nearly! ') + right + ' of ' + total + (right === 1 ? ' is' : ' are') + ' right. Look at the ✗ ones.';
      }
      function mark(el, ok) {
        el.classList.add(ok ? 'is-correct' : 'is-wrong');
        el.appendChild(h('span', { class: 'gg-mark', 'aria-hidden': 'true', text: ok ? '✓' : '✗' }));
      }

      /* multiple choice + true/false */
      function bodyChoice(ctx) {
        var item = ctx.item;
        var box = h('div', { class: 'qi-choices' + (item.type === 'tf' ? ' gg-tf' : '') });
        var opts = item.type === 'tf' ? item.options : shuffle(item.options);
        opts.forEach(function (o) {
          var b = h('button', { type: 'button', class: 'qi-choice', onclick: function () {
            if (ctx.answered) return;
            var ok = o === item.answer;
            each(box.children, function (c) {
              c.disabled = true;
              if (c.textContent === item.answer) c.classList.add('is-correct');
            });
            if (!ok) b.classList.add('is-wrong');
            resolve(ctx, ok, b, item.type === 'tf'
              ? 'Not quite. That sentence is ' + item.answer.toLowerCase() + '.'
              : 'Not quite. The answer is “' + item.answer + '”.');
          } }, o);
          box.appendChild(b);
        });
        ctx.body.appendChild(box);
      }

      /* label the diagram */
      function bodyLabel(ctx) {
        var item = ctx.item, D = DIAGRAMS[item.diagram];
        var spots = Object.keys(D.spots).filter(function (id) {
          return item.items.some(function (it) { return it.target === id; });
        });
        var tokens = shuffle(item.items.map(function (it) { return { text: it.text, target: it.target }; }));
        var placed = {}, sel = null, locked = false;
        var tray = h('div', { class: 'gg-tray', role: 'group', 'aria-label': 'Labels to place' });
        var diag = h('div', { class: 'gg-diagram', html: diagramSVG(D, spots) });
        var list = h('div', { class: 'gg-slots' });
        var pins = {}, slots = {};
        spots.forEach(function (id, n) {
          var L = 'ABCDEF'.charAt(n), sp = D.spots[id];
          var pin = h('button', { type: 'button', class: 'gg-pin',
            style: { left: (sp.p[0] / 3) + '%', top: (sp.p[1] / 2.4) + '%' },
            onclick: function () { tapSpot(id); } }, L);
          diag.appendChild(pin);
          pins[id] = pin;
          var slot = h('button', { type: 'button', class: 'gg-slot', onclick: function () { tapSpot(id); } });
          list.appendChild(slot);
          slots[id] = { el: slot, L: L };
        });
        var check = h('button', { type: 'button', class: 'qi-btn', disabled: true, onclick: doCheck }, 'Check my labels');
        ctx.body.appendChild(h('p', { class: 'gg-help', text: 'Tap a label, then tap a letter on the picture or in the list.' }));
        ctx.body.appendChild(tray);
        ctx.body.appendChild(h('div', { class: 'gg-labelgrid' }, diag, list));
        ctx.actions.appendChild(check);

        function where(tok) { for (var id in placed) if (placed[id] === tok) return id; return null; }
        function render(focusTok) {
          tray.innerHTML = '';
          tokens.forEach(function (tok) {
            if (where(tok)) return;
            var b = h('button', {
              type: 'button', class: 'qi-token' + (sel === tok ? ' is-selected' : ''), 'aria-pressed': String(sel === tok),
              onclick: function () { if (locked) return; sel = sel === tok ? null : tok; api.sound('tap'); render(tok); }
            }, tok.text);
            tray.appendChild(b);
            if (focusTok === tok) b.focus();
          });
          spots.forEach(function (id) {
            var s = slots[id], tok = placed[id];
            s.el.innerHTML = '';
            s.el.appendChild(h('span', { class: 'gg-letter', text: s.L }));
            s.inner = h('span', null, tok ? h('span', { text: tok.text }) : h('span', { class: 'gg-empty', text: sel ? 'Tap to put it here' : 'Empty' }));
            s.el.appendChild(s.inner);
            s.el.classList.toggle('filled', !!tok);
            s.el.setAttribute('aria-label', 'Spot ' + s.L + ' (' + D.spots[id].d + '): ' + (tok ? tok.text : 'empty'));
            pins[id].classList.toggle('filled', !!tok);
            pins[id].classList.toggle('armed', !!sel);
            pins[id].setAttribute('aria-label', 'Spot ' + s.L + ' (' + D.spots[id].d + ')' + (tok ? ': ' + tok.text : ''));
          });
          check.disabled = Object.keys(placed).length < spots.length;
        }
        function tapSpot(id) {
          if (locked) return;
          if (sel) {
            var from = where(sel);
            if (from) delete placed[from];
            placed[id] = sel;
            sel = null;
            api.sound('flip');
          } else if (placed[id]) {
            sel = placed[id];
            delete placed[id];
            api.sound('tap');
          } else {
            api.shake(tray);
          }
          render();
        }
        function doCheck() {
          if (locked) return;
          locked = true;
          var right = 0;
          spots.forEach(function (id) {
            var ok = placed[id].target === id;
            if (ok) right++;
            mark(slots[id].el, ok);
            pins[id].classList.add(ok ? 'is-correct' : 'is-wrong');
            pins[id].classList.remove('armed');
            var lab = 'Spot ' + slots[id].L + ' (' + D.spots[id].d + '): ' + placed[id].text + (ok ? '. Right.' : '. Wrong.');
            if (!ok) {
              var corr = item.items.filter(function (it) { return it.target === id; })[0];
              slots[id].inner.appendChild(h('span', { class: 'gg-fix', text: 'Should be: ' + corr.text }));
              lab += ' Should be: ' + corr.text + '.';
            }
            slots[id].el.setAttribute('aria-label', lab);
            pins[id].setAttribute('aria-label', lab);
          });
          tray.classList.add('done');
          lockAll(ctx.body);
          check.remove();
          resolve(ctx, right === spots.length, diag, partialLead(right, spots.length));
        }
        render();
      }

      /* sort into groups */
      function bodySort(ctx) {
        var item = ctx.item;
        var tokens = shuffle(item.items.map(function (it) { return { text: it.text, group: it.group, at: null }; }));
        var sel = null, locked = false;
        var tray = h('div', { class: 'gg-tray', role: 'group', 'aria-label': 'Cards to sort' });
        var zonesBox = h('div', { class: 'gg-zones' });
        var zones = {};
        item.groups.forEach(function (g) {
          var listEl = h('div', { class: 'qi-stack', style: { gap: '8px' } });
          var head = h('button', { type: 'button', class: 'gg-zonehead', onclick: function (e) { e.stopPropagation(); drop(g.id); } }, g.name);
          var z = h('div', { class: 'qi-drop gg-zone', onclick: function () { drop(g.id); } }, head, listEl);
          zones[g.id] = { el: z, list: listEl, head: head };
          zonesBox.appendChild(z);
        });
        var check = h('button', { type: 'button', class: 'qi-btn', disabled: true, onclick: doCheck }, 'Check my sorting');
        ctx.body.appendChild(h('p', { class: 'gg-help', text: 'Tap a card, then tap the group it belongs in.' }));
        ctx.body.appendChild(tray);
        ctx.body.appendChild(zonesBox);
        ctx.actions.appendChild(check);

        function tokBtn(tok) {
          return h('button', {
            type: 'button', class: 'qi-token' + (sel === tok ? ' is-selected' : ''), 'aria-pressed': String(sel === tok),
            onclick: function (e) { e.stopPropagation(); if (locked) return; sel = sel === tok ? null : tok; api.sound('tap'); render(tok); }
          }, tok.text);
        }
        function render(focusTok) {
          tray.innerHTML = '';
          item.groups.forEach(function (g) {
            zones[g.id].list.innerHTML = '';
            zones[g.id].el.classList.toggle('is-target', !!sel && !locked);
            zones[g.id].head.setAttribute('aria-label', 'Put in group: ' + g.name);
          });
          tokens.forEach(function (tok) {
            tok.btn = tokBtn(tok);
            (tok.at ? zones[tok.at].list : tray).appendChild(tok.btn);
            if (focusTok === tok) tok.btn.focus();
          });
          check.disabled = tokens.some(function (t) { return !t.at; });
        }
        function drop(gid) {
          if (locked) return;
          if (!sel) { api.shake(tray); return; }
          sel.at = gid;
          sel = null;
          api.sound('flip');
          render();
        }
        function doCheck() {
          if (locked) return;
          locked = true;
          render();
          var right = 0;
          var names = {};
          item.groups.forEach(function (g) { names[g.id] = g.name; });
          tokens.forEach(function (tok) {
            var ok = tok.at === tok.group;
            if (ok) right++;
            mark(tok.btn, ok);
            if (!ok) tok.btn.appendChild(h('span', { class: 'gg-fix', text: ' → ' + names[tok.group] }));
          });
          tray.classList.add('done');
          lockAll(ctx.body);
          check.remove();
          resolve(ctx, right === tokens.length, zonesBox, partialLead(right, tokens.length));
        }
        render();
      }

      /* put in order */
      function bodyOrder(ctx) {
        var item = ctx.item;
        var base = item.steps.map(function (t, k) { return { text: t, k: k }; });
        var tokens = shuffle(base);
        var guard = 0;
        while (tokens.every(function (t, i) { return t.k === i; }) && guard++ < 10) tokens = shuffle(base);
        var seq = [], locked = false;
        var tray = h('div', { class: 'gg-tray', role: 'group', 'aria-label': 'Steps to order' });
        var list = h('ol', { class: 'gg-order' });
        var check = h('button', { type: 'button', class: 'qi-btn', disabled: true, onclick: doCheck }, 'Check my order');
        ctx.body.appendChild(h('p', { class: 'gg-help', text: 'Tap the steps in the right order. Tap a placed step to take it back.' }));
        ctx.body.appendChild(tray);
        ctx.body.appendChild(list);
        ctx.actions.appendChild(check);
        var slotEls = [];

        /* focus: { tray: n } re-focuses the n-th tray step (or Check when the tray is empty), { slot: i } the i-th slot */
        function render(focus) {
          tray.innerHTML = '';
          var trayBtns = [];
          tokens.forEach(function (tok) {
            if (seq.indexOf(tok) >= 0) return;
            var n = trayBtns.length;
            var b = h('button', { type: 'button', class: 'qi-token', onclick: function () {
              if (locked) return; seq.push(tok); api.sound('flip'); render({ tray: n });
            } }, tok.text);
            trayBtns.push(b);
            tray.appendChild(b);
          });
          list.innerHTML = '';
          slotEls = [];
          for (var i = 0; i < tokens.length; i++) {
            (function (i) {
              var tok = seq[i];
              var b = h('button', { type: 'button', class: 'gg-slot' + (tok ? ' filled' : ''), onclick: function () {
                if (locked || !seq[i]) return; seq.splice(i, 1); api.sound('tap'); render({ slot: i });
              } }, h('span', { class: 'gg-letter', text: String(i + 1) }),
                 h('span', null, tok ? h('span', { text: tok.text }) : h('span', { class: 'gg-empty', text: 'Step ' + (i + 1) })));
              b.setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + (tok ? tok.text + '. Tap to remove.' : 'empty'));
              slotEls.push(b);
              list.appendChild(h('li', null, b));
            })(i);
          }
          check.disabled = seq.length < tokens.length;
          if (focus && focus.slot != null) slotEls[focus.slot].focus();
          else if (focus && focus.tray != null) {
            if (trayBtns.length) trayBtns[Math.min(focus.tray, trayBtns.length - 1)].focus();
            else if (!check.disabled) check.focus();
          }
        }
        function doCheck() {
          if (locked) return;
          locked = true;
          var right = 0;
          seq.forEach(function (tok, i) {
            var ok = tok.k === i;
            if (ok) right++;
            mark(slotEls[i], ok);
            slotEls[i].setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + tok.text + (ok ? '. Right.' : '. Wrong.'));
          });
          tray.classList.add('done');
          lockAll(ctx.body);
          check.remove();
          var ok = right === tokens.length;
          if (!ok) {
            ctx.body.appendChild(h('div', { class: 'qi-stack', style: { gap: '6px' } },
              h('p', { class: 'gg-help', text: 'The right order is:' }),
              h('ol', { class: 'gg-answer' }, item.steps.map(function (t) { return h('li', { text: t }); }))));
          }
          resolve(ctx, ok, list, partialLead(right, tokens.length));
        }
        render();
      }

      /* ---------- the end: celebrate the plant ---------- */
      function celebrate() {
        clearTimers();
        root.innerHTML = '';
        api.scrollTop();
        api.progress(1, 1);
        var N = run.items.length, s = Math.min(run.score, 10);
        var box = h('div', { class: 'gg-plantbox', html: plantSVG() });
        var svg = box.querySelector('svg');
        var msg;
        if (s >= 10) msg = ['Super Bloom!', 'A perfect run! Your plant grew roots, leaves and a flower, a bee pollinated it, and now its seeds are flying off to grow new plants.'];
        else if (s >= 7) msg = ['It\'s in bloom!', 'Your plant grew all the way to a flower' + (s >= 9 ? ' and made seeds' : s >= 8 ? ' and a bee came to pollinate it' : '') + '. Get every answer right to grow a Super Bloom!'];
        else if (s >= 4) msg = ['Growing strong!', 'Your plant has a stem and leaves to make food from sunlight. A few more right answers and it will flower!'];
        else if (s >= 1) msg = ['It\'s sprouted!', 'Every plant starts small. Play again and help your seed grow into a flower.'];
        else msg = ['Still a seed!', 'Every plant starts as a seed. Play again and help your seed grow roots, leaves and a flower.'];
        var done = false;
        var btn = h('button', { type: 'button', class: 'qi-btn', onclick: function () {
          if (done) return;
          done = true;
          clearTimers();
          setStage(svg, s);
          api.finish({ score: run.score, max: N });
        } }, 'Collect my stars');
        var panel = h('div', { class: 'qi-panel gg-cele' },
          h('div', { class: 'qi-eyebrow', text: 'Final stage: ' + STAGES[s].name }),
          box,
          h('h2', { class: 'qi-h', text: msg[0] }),
          h('p', { class: 'qi-sub', text: msg[1] }),
          h('p', { class: 'gg-score', text: 'You answered ' + run.score + ' out of ' + N + ' questions correctly.' }),
          btn);
        guardClicks(panel);
        readyAt = Date.now() + 300;
        root.appendChild(panel);
        growTo(svg, s, 260, 200);
        later(function () {
          if (s >= 7) { api.sound('win'); api.burst(box); }
          else api.sound('correct');
        }, 260 + 260 * Math.max(s, 1));
        btn.focus();
      }

      showStart();

      return function cleanup() {
        dead = true;
        clearTimers();
      };
    }
  });
})();

  function shuf(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function sortInstance(s, sh) {
    var chosen = [], rest = [];
    s.zones.forEach(function (z) {
      var mine = sh(s.items.filter(function (it) { return it[1] === z.id; }));
      chosen.push(mine[0]);
    });
    s.items.forEach(function (it) { if (chosen.indexOf(it) < 0) rest.push(it); });
    chosen = chosen.concat(sh(rest).slice(0, Math.max(0, s.n - chosen.length)));
    return { t: 'sort', s: s, items: sh(chosen) };
  }

  function pickKeys(n, sh) {
    var lists = sh(KEYS).map(function (k) { return sh(k.creatures).map(function (c) { return { t: 'key', k: k, c: c }; }); });
    var out = [], i = 0;
    while (out.length < n && lists.some(function (l) { return l.length; })) {
      var l = lists[i % lists.length]; if (l.length) out.push(l.shift()); i++;
    }
    return out;
  }

  function take(kind, n, sh) {
    if (kind === 'key') return pickKeys(n, sh);
    if (kind === 'sort') return sh(SORTS).slice(0, n).map(function (s) { return sortInstance(s, sh); });
    if (kind === 'chain') return sh(CHAINS).slice(0, n).map(function (c) { return { t: 'chain', chain: c }; });
    return sh(MCQ.filter(function (m) { return m.c === kind; })).slice(0, n).map(function (m) { return { t: 'mc', m: m }; });
  }

  function buildRun(modeId, sh) {
    sh = sh || shuf;
    var mode = MODES.filter(function (m) { return m.id === modeId; })[0] || MODES[0];
    var groups = mode.plan.map(function (p) { return take(p[0], p[1], sh); });
    var out = [];
    if (mode.order === 'alt') {
      var max = Math.max.apply(null, groups.map(function (g) { return g.length; }));
      for (var i = 0; i < max; i++) groups.forEach(function (g) { if (g[i]) out.push(g[i]); });
    } else {
      groups.forEach(function (g) { out = out.concat(g); });
      if (mode.order === 'shuffle') out = sh(out);
    }
    return out;
  }

      var chain = item.chain, pos = 0, slips = 0;

        el('div', { class: 'qi-eyebrow', text: 'Food Chain Trail' }),
        el('p', { class: 'qi-prompt', text: 'Build the food chain. Start with the producer, then tap who eats it, and so on.' }),
        el('p', { class: 'hh-rule', text: 'Get it with no slips to earn the point.' }),
        row, tray, fb));
    }

    /* ---------- 4. multiple choice / true-false ---------- */
    function renderMC(item, box, done) {

      var isTF = m.o === TF;

        b.addEventListener('click', function () {

            b.classList.add('is-wrong'); api.wrong(b);
            btns.forEach(function (x, i) { if (opts[i] === m.a) x.classList.add('is-correct'); });
          }
          fbHolder.appendChild(feedback(ok, (ok ? 'Spot on! ' : 'Not quite. The answer is “' + m.a + '”. ') + m.why));
          done(ok);
        });
        return b;
      });
      box.appendChild(el('div', { class: 'qi-panel qi-stack' + (m.c === 'odd' ? ' hh-odd' : '') },
        el('div', { class: 'qi-eyebrow', text: label }),
        el('p', { class: 'qi-prompt', text: m.q }),
        el('div', { class: 'qi-choices' }, btns),

    }

    /* ---------- final ---------- */
    function showFinal() {

        el('div', { html: BADGE }),
        el('div', { class: 'qi-eyebrow', text: 'Ranger report' }),
        el('h2', { class: 'qi-h', text: 'Rank reached: ' + RANKS[r] }),
        el('p', { class: 'qi-sub', text: 'You got ' + run.score + ' of ' + total + ' field tasks right.' + (r < 4 ? ' Score 9 or more to become Chief Ranger!' : ' The whole harbour salutes you!') })));
      api.scrollTop();
      finishTimer = later(function () { finishTimer = null; api.finish({ score: run.score, max: total }); }, 350);
    }

    showStart();

    return function cleanup() {
      alive = false;
      timers.forEach(clearTimeout);
      timers = [];
    };

  function norm(p) { return typeof p === 'string' ? { t: p } : p; }
  // Split a paragraph into tappable units: sentences (prose), lines (poem) or list items.
  function units(p, kind) {
    p = norm(p);
    if (p.list) return p.list.slice();
    if (kind === 'poem') return p.t.split('\n');
    // No lookbehind (unsupported before Safari 16.4): mark each break, then split on the mark.
    return p.t.replace(/([.!?][’”]?)\s+(?=[‘“A-Z])/g, '$1\u0000').split('\u0000');
  }
  function core(tok) { return tok.replace(/^[^A-Za-z0-9]+/, '').replace(/[^A-Za-z0-9]+$/, ''); }
  function wordsIn(str) { return str.split(/\s+/).map(core).filter(Boolean); }
  function countWords(t) {
    var n = 0;
    t.paras.forEach(function (p) {
      p = norm(p);
      if (p.h) n += wordsIn(p.h).length;
      n += wordsIn(p.list ? p.list.join(' ') : p.t).length;
    });
    return n;
  }
  // Read-aloud is split into short utterances (one per sentence, or one per verse/list),
  // because some network voices stop after about 15 seconds of a single utterance.
  function paraChunks(p, kind) {
    p = norm(p);
    var lead = (p.h ? p.h + '. ' : '') + (p.step ? 'Step ' + p.step + '. ' : '');
    var parts = p.list ? [p.list.join(', ') + '.'] : kind === 'poem' ? [units(p, kind).join(' ')] : units(p, kind);
    parts = parts.slice();
    parts[0] = lead + parts[0];
    return parts;
  }
  function textChunks(t) {
    var out = [t.title + '.'];
    t.paras.forEach(function (p) { out = out.concat(paraChunks(p, t.kind)); });
    return out;
  }
