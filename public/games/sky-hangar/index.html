<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Sky Hangar: take a Super Cub, an F-16 and a Boeing 737 apart in 3D, then train as a pilot and earn your own plane.">
<title>Sky Hangar</title>
<style>
  :root {
    color-scheme: dark;
    --ground: #0d1b2a;
    --ink: #0d1b2a;
    --ink-2: #48607a;
    --paper: #f2f6fb;
    --muted: #a8bdd3;
    --card: #f7f9fc;
    --line: rgba(13, 27, 42, .14);
    --glass: rgba(9, 22, 38, .8);
    --glass-line: rgba(190, 220, 255, .18);
    --sky: #7cc4ff;
    --accent: #ff8a1f;
    --accent-dark: #b85a0c;
    --accent-ink: #fff;
    --spark: #ffd23f;
    --ok: #2bb673;
    --bad: #e5484d;
    --display: "Avenir Next Condensed", "Avenir Next", "Futura", "Trebuchet MS", system-ui, sans-serif;
    --body: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--ground); color: var(--paper); font: 500 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--spark); outline-offset: 2px; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 700 20px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-inline: 16px; text-align: center; }
  /* every mode puts its HUD in its own child of #ui and removes it on exit */
  #ui { position: fixed; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; }
  #ui > * { position: absolute; inset: 0; pointer-events: none; }
  :where(#ui > * > *) { pointer-events: auto; }

  .btn { border: 0; border-radius: 14px; padding: 13px 20px; font: 700 17px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; transition: transform .12s, filter .12s; }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--accent-dark); }
  .btn.ghost { background: rgba(255, 255, 255, .1); color: var(--paper); box-shadow: inset 0 0 0 1px var(--glass-line); }
  .glass { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 18px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  /* inside the YoeltheG player a round back button sits in the top-left corner: keep it clear */
  .embedded .tl-safe { margin-left: 72px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">Rolling the planes out of the hangar…</div>

  .layer-hangar { --tl: 72px; }
  /* index.html's '#ui > * > *' turns pointer events back on for direct children: these overlays must stay see-through */
  #ui > .layer-hangar > .hb-pins, #ui > .layer-hangar > .hb-bar, #ui > .layer-hangar > .hb-toast { pointer-events: none; }
  .embedded .layer-hangar { --tl: 132px; }
  .layer-hangar .hb-bar { position: absolute; top: calc(12px + var(--safe-t)); left: var(--tl); right: 12px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; justify-content: space-between; pointer-events: none; }
  .layer-hangar .hb-bar > * { pointer-events: auto; }
  .layer-hangar .seg { display: flex; gap: 4px; padding: 4px; border-radius: 16px; }
  .layer-hangar .seg button { min-height: 44px; min-width: 44px; border: 0; background: none; padding: 0 14px; border-radius: 12px; font: 700 15px var(--display); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .layer-hangar .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
  .layer-hangar .seg.planes button[aria-pressed="true"] { background: var(--spark); }
  .layer-hangar .seg button:disabled { opacity: .4; }

  .layer-hangar .hb-dock { position: absolute; left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); display: grid; gap: 8px; justify-items: center; pointer-events: none; }
  .layer-hangar .hb-dock > * { pointer-events: auto; max-width: 100%; }
  .layer-hangar .strip { display: flex; gap: 6px; overflow-x: auto; padding: 6px; border-radius: 16px; scrollbar-width: none; touch-action: pan-x; }
  .layer-hangar .strip::-webkit-scrollbar { display: none; }
  .layer-hangar .chip { flex: none; min-height: 44px; border: 0; border-radius: 999px; padding: 0 14px 0 10px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px var(--glass-line); font: 600 14px var(--body); white-space: nowrap; }
  .layer-hangar .chip i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .layer-hangar .chip[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
  .layer-hangar .row { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 18px; width: min(720px, 100%); box-sizing: border-box; }
  .layer-hangar .row .btn { min-height: 48px; flex: none; }
  .layer-hangar .row .icon { width: 48px; padding: 0; display: grid; place-items: center; font-size: 22px; }
  .layer-hangar .slider { flex: 1; min-width: 80px; display: grid; gap: 2px; }
  .layer-hangar .slider small { display: flex; justify-content: space-between; color: var(--muted); font: 700 11px var(--display); letter-spacing: .12em; text-transform: uppercase; }
  .layer-hangar input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: none; margin: 0; touch-action: none; }
  .layer-hangar input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--spark) var(--p, 0%), rgba(255,255,255,.18) var(--p, 0%)); }
  .layer-hangar input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; margin-top: -12px; border-radius: 50%; background: var(--paper); border: 3px solid var(--spark); box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .layer-hangar input[type=range]::-moz-range-track { height: 10px; border-radius: 5px; background: rgba(255,255,255,.18); }
  .layer-hangar input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: var(--paper); border: 3px solid var(--spark); }

  .layer-hangar .hb-card { position: absolute; right: 12px; top: var(--top, 76px); width: min(340px, calc(100% - 24px)); padding: 16px 18px 18px; border-radius: 20px; background: var(--card); color: var(--ink); box-shadow: 0 10px 30px rgba(0,0,0,.35); max-height: calc(100% - 200px); overflow: auto; }
  .layer-hangar .hb-card h2 { margin: 6px 40px 6px 0; font: 800 24px/1.05 var(--display); letter-spacing: .02em; text-transform: uppercase; }
  .layer-hangar .hb-card p { margin: 8px 0 0; font-size: 16px; line-height: 1.4; }
  .layer-hangar .hb-card .fact { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #fff3cf; color: #5b4300; font-size: 15px; }
  .layer-hangar .hb-card .fact b { display: block; font: 800 12px var(--display); letter-spacing: .14em; text-transform: uppercase; color: #a87400; }
  .layer-hangar .hb-card .x { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(13,27,42,.07); font-size: 20px; color: var(--ink); }
  .layer-hangar .hb-card .btn { margin-top: 12px; width: 100%; min-height: 48px; }
  .layer-hangar .sys { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px; background: rgba(13,27,42,.07); font: 700 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .layer-hangar .sys i { width: 14px; height: 14px; border-radius: 50%; }

  .layer-hangar .hb-pins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .layer-hangar .pin { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); padding: 5px 10px; border-radius: 10px; background: var(--glass); border: 1px solid var(--glass-line); font: 700 13px var(--display); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; transition: background .15s, color .15s; }
  .layer-hangar .pin.big { font-size: 15px; padding: 7px 12px; background: var(--paper); color: var(--ink); }
  .layer-hangar .pin.hot { background: var(--spark); color: var(--ink); border-color: transparent; }
  .layer-hangar .pin small { display: block; font: 600 11px var(--body); letter-spacing: 0; text-transform: none; opacity: .75; }

  .layer-hangar .hb-step { position: absolute; left: 12px; top: var(--top, 76px); width: min(380px, calc(100% - 24px)); box-sizing: border-box; padding: 12px 14px; border-radius: 18px; }
  .layer-hangar .hb-step .k { display: flex; justify-content: space-between; gap: 8px; color: var(--sky); font: 700 12px var(--display); letter-spacing: .14em; text-transform: uppercase; }
  .layer-hangar .hb-step .k span:last-child { color: var(--spark); }
  .layer-hangar .hb-step p { margin: 4px 0 0; font-size: 16px; line-height: 1.35; }
  .layer-hangar .dots { display: flex; gap: 4px; margin-top: 8px; }
  .layer-hangar .dots i { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); }
  .layer-hangar .dots i.on { background: var(--ok); }

  .layer-hangar .hb-tray { position: absolute; right: 12px; top: var(--top, 76px); bottom: calc(12px + var(--safe-b)); width: 212px; padding: 8px; border-radius: 18px; display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 8px; overflow-y: auto; touch-action: pan-y; }
  .layer-hangar .portrait .hb-tray, .layer-hangar.portrait .hb-tray { top: auto; left: 12px; width: auto; height: 132px; grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 100px; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; }
  .layer-hangar .tcard { position: relative; border: 0; padding: 4px 4px 6px; border-radius: 14px; background: var(--card); color: var(--ink); display: grid; justify-items: center; gap: 2px; font: 700 12px/1.1 var(--display); letter-spacing: .03em; text-transform: uppercase; text-align: center; box-shadow: 0 3px 0 rgba(0,0,0,.25); transition: opacity .15s, transform .15s, box-shadow .15s; touch-action: none; -webkit-touch-callout: none; }
  .layer-hangar .tcard canvas { width: 84px; height: 84px; border-radius: 10px; pointer-events: none; }
  .layer-hangar .tcard span { min-height: 2.2em; display: grid; place-items: center; pointer-events: none; }
  .layer-hangar .tcard.ready { box-shadow: 0 0 0 3px var(--spark), 0 3px 0 rgba(0,0,0,.25); }
  .layer-hangar .tcard.locked { opacity: .45; }
  .layer-hangar .tcard.locked::after { content: '\u{1F512}'; position: absolute; top: 6px; right: 8px; font-size: 14px; }
  .layer-hangar .tcard.sel { transform: translateY(-2px); box-shadow: 0 0 0 4px var(--accent), 0 3px 0 rgba(0,0,0,.25); }
  .layer-hangar .tcard.out { opacity: .2; }
  .layer-hangar .tcard.gone { display: none; }

  .layer-hangar .hb-toast { position: absolute; z-index: 6; left: var(--toastx, 50%); bottom: calc(var(--toastb, 24px) + var(--safe-b)); transform: translateX(-50%); max-width: min(520px, calc(100% - 32px)); padding: 12px 18px; border-radius: 16px; font: 600 16px/1.3 var(--body); text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .layer-hangar .hb-toast.on { opacity: 1; }
  .layer-hangar.toast-top .hb-toast { top: var(--toastt, 130px); bottom: auto; }
  .layer-hangar .hb-toast.good { background: var(--ok); color: #fff; border-color: transparent; }
  .layer-hangar .hb-toast.bad { background: var(--bad); color: #fff; border-color: transparent; }

  /* above the bar and the back button, so nothing behind a question can be tapped */
  .layer-hangar .hb-modal { position: absolute; z-index: 5; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(8,14,22,.45); }
  .embedded .layer-hangar .hb-modal { padding-top: calc(72px + var(--safe-t)); } /* clear of the YTG back button */
  .layer-hangar .hb-modal .box { box-sizing: border-box; width: min(460px, 100%); max-height: calc(100% - 8px); overflow: auto; padding: 22px 22px 20px; border-radius: 24px; background: var(--card); color: var(--ink); box-shadow: 0 14px 40px rgba(0,0,0,.45); }
  .layer-hangar .hb-modal.wide .box { width: min(620px, 100%); }
  .layer-hangar .hb-modal h2 { margin: 0 0 8px; font: 800 28px/1.05 var(--display); letter-spacing: .02em; text-transform: uppercase; }
  .layer-hangar .hb-modal p { margin: 8px 0; font-size: 16px; line-height: 1.4; }
  .layer-hangar .hb-modal .kicker { font: 700 12px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--accent-dark); }
  .layer-hangar .hb-modal .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .layer-hangar .hb-modal .btns .btn { flex: 1 1 140px; min-height: 52px; }
  .layer-hangar .hb-modal .btn.ghost { background: rgba(13,27,42,.07); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .layer-hangar .lvl { display: flex; gap: 6px; margin: 12px 0 4px; }
  .layer-hangar .lvl button { flex: 1; min-height: 64px; border: 0; border-radius: 14px; padding: 8px 10px; text-align: left; background: rgba(13,27,42,.06); color: var(--ink); font: 600 13px/1.25 var(--body); }
  .layer-hangar .lvl button b { display: block; font: 800 16px var(--display); letter-spacing: .05em; text-transform: uppercase; }
  .layer-hangar .lvl button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .layer-hangar .stars { font-size: 40px; letter-spacing: 6px; color: #f3b000; text-align: center; }
  .layer-hangar .stars .off { color: rgba(13,27,42,.15); }
  .layer-hangar .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; text-align: center; }
  .layer-hangar .stats div { padding: 8px; border-radius: 12px; background: rgba(13,27,42,.06); font: 800 22px var(--display); }
  .layer-hangar .stats small { display: block; font: 700 11px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
  .layer-hangar .opts { display: grid; gap: 8px; margin-top: 12px; }
  .layer-hangar .opts button { min-height: 56px; border: 0; border-radius: 14px; padding: 10px 14px; text-align: left; background: rgba(13,27,42,.06); color: var(--ink); font: 600 16px/1.3 var(--body); box-shadow: inset 0 0 0 2px transparent; }
  .layer-hangar .opts button.right { background: #d8f5e5; box-shadow: inset 0 0 0 2px var(--ok); }
  .layer-hangar .opts button.wrong { background: #fde2e2; box-shadow: inset 0 0 0 2px var(--bad); }
  .layer-hangar .spec { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 15px; }
  .layer-hangar .spec th { text-align: left; padding: 7px 10px 7px 0; width: 38%; vertical-align: top; font: 700 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .layer-hangar .spec td { padding: 7px 0; border-bottom: 1px solid var(--line); line-height: 1.3; }
  .layer-hangar .spec tr:first-child td { border-top: 1px solid var(--line); }

  .layer-hangar .hb-cmp { position: absolute; left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); margin: 0 auto; max-width: 760px; padding: 12px 14px; border-radius: 20px; background: var(--card); color: var(--ink); box-shadow: 0 10px 30px rgba(0,0,0,.35); max-height: 46%; overflow: auto; }
  .layer-hangar .hb-cmp h3 { margin: 0 0 6px; font: 800 18px var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .layer-hangar .cmp { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 4px 10px; align-items: center; font-size: 13px; }
  .layer-hangar .cmp .h { font: 800 13px var(--display); letter-spacing: .05em; text-transform: uppercase; text-align: left; border: 0; background: none; padding: 6px 0; color: var(--ink); min-height: 44px; }
  .layer-hangar .cmp .lab { font: 700 11px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .layer-hangar .cmp .bar { position: relative; height: 22px; border-radius: 6px; background: rgba(13,27,42,.06); overflow: hidden; }
  .layer-hangar .cmp .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--sky); }
  .layer-hangar .cmp .bar span { position: relative; padding-left: 6px; line-height: 22px; font-weight: 700; white-space: nowrap; }

  .layer-hangar .hb-ctl { position: absolute; inset: 0; pointer-events: none; }
  .layer-hangar .hb-ctl > * { pointer-events: auto; }
  .layer-hangar .checks { position: absolute; top: var(--top, 76px); left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 6px; border-radius: 16px; max-width: calc(100% - 24px); }
  .layer-hangar .checks span { min-height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.08); font: 700 13px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .layer-hangar .checks span.ok { background: var(--ok); color: #fff; }
  .layer-hangar .stickbox { position: absolute; left: 16px; bottom: calc(16px + var(--safe-b)); display: grid; gap: 8px; justify-items: center; padding: 10px; border-radius: 20px; }
  .layer-hangar .pad { position: relative; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.1), rgba(255,255,255,.03)); box-shadow: inset 0 0 0 2px var(--glass-line); touch-action: none; }
  .layer-hangar .pad::before, .layer-hangar .pad::after { content: ''; position: absolute; background: rgba(255,255,255,.12); }
  .layer-hangar .pad::before { left: 50%; top: 12px; bottom: 12px; width: 2px; }
  .layer-hangar .pad::after { top: 50%; left: 12px; right: 12px; height: 2px; }
  .layer-hangar .knob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: var(--paper); box-shadow: 0 3px 8px rgba(0,0,0,.4), inset 0 0 0 4px var(--accent); pointer-events: none; }
  .layer-hangar .stickbox small, .layer-hangar .thr small { font: 700 11px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: center; }
  .layer-hangar .thr { position: absolute; right: 16px; bottom: calc(16px + var(--safe-b)); display: grid; gap: 8px; justify-items: center; padding: 10px; border-radius: 20px; width: 150px; }
  .layer-hangar .thr .btn { width: 100%; min-height: 48px; padding: 0 8px; }
  .layer-hangar .thr .btn.ghost { min-height: 44px; font-size: 14px; }
  .layer-hangar .trk { position: relative; touch-action: none; }
  .layer-hangar .trk::before { content: ''; position: absolute; background: rgba(255,255,255,.16); border-radius: 5px; }
  .layer-hangar .trk i { position: absolute; background: var(--spark); border-radius: 5px; }
  .layer-hangar .trk b { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: var(--paper); border: 3px solid var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,.4); pointer-events: none; }
  .layer-hangar .trk.h { width: 150px; height: 44px; }
  .layer-hangar .trk.h::before, .layer-hangar .trk.h i { top: 17px; height: 10px; }
  .layer-hangar .trk.h::before { left: 0; right: 0; }
  .layer-hangar .trk.h b { top: 5px; margin-left: -17px; }
  .layer-hangar .trk.v { width: 56px; height: 130px; }
  .layer-hangar .trk.v::before, .layer-hangar .trk.v i { left: 23px; width: 10px; bottom: 0; }
  .layer-hangar .trk.v::before { top: 0; }
  .layer-hangar .trk.v b { left: 11px; margin-bottom: -17px; }
  .layer-hangar .ctl-next { position: absolute; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); }
  .layer-hangar .ctl-next .btn { min-height: 52px; }

  @media (max-width: 700px) {
    .layer-hangar .seg button { padding: 0 10px; font-size: 13px; }
    .layer-hangar .hb-card { top: auto; left: 12px; right: 12px; width: auto; bottom: var(--dock, 150px); max-height: 44%; }
    .layer-hangar .hb-card h2 { font-size: 20px; }

  }

  .fs-att .wings::after { content: ''; position: absolute; left: 50%; top: -3px; width: 6px; height: 10px; margin-left: -3px; border-radius: 3px; background: var(--spark); }

  .fs-toast.good { background: rgba(31, 140, 86, .9); } .fs-toast.bad { background: rgba(190, 40, 45, .92); } .fs-toast.tip { font: 600 16px/1.3 var(--body); }
  .fs-stall { padding: 10px 22px; border-radius: 14px; background: #d8262c; font: 900 26px/1 var(--display); letter-spacing: .12em; animation: fsBlink .5s steps(2) infinite; }
  @keyframes fsPop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fsBlink { 50% { opacity: .35; } }
  .fs-bottom { position: absolute; left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); display: flex; align-items: flex-end; gap: 10px; pointer-events: none; }
  .fs-stick { pointer-events: auto; touch-action: none; position: relative; width: 156px; height: 156px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.1) 0 30%, rgba(8,20,34,.45) 31%); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); flex: none; }
  .fs-stick::before, .fs-stick::after { content: ''; position: absolute; background: rgba(255,255,255,.18); }
  .fs-stick::before { left: 50%; top: 10px; bottom: 10px; width: 2px; margin-left: -1px; } .fs-stick::after { top: 50%; left: 10px; right: 10px; height: 2px; margin-top: -1px; }
  .fs-knob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #c9d6e3 60%, #8ea3b8); box-shadow: 0 4px 10px rgba(0,0,0,.35); z-index: 1; }
  .fs-stick .lbl { position: absolute; left: 0; right: 0; text-align: center; font: 700 10px var(--display); letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.75); }

  .fs-b small { display: block; font: 700 10px/1 var(--display); color: var(--muted); margin-top: 2px; text-transform: none; }

  .fs-thr .fill { position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 10px; background: linear-gradient(#ffb347, var(--accent)); }
  .fs-thr .handle { position: absolute; left: 4px; right: 4px; height: 26px; margin-bottom: -13px; border-radius: 9px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .fs-thr .pct { position: absolute; top: 6px; left: 0; right: 0; text-align: center; font: 800 15px var(--display); text-shadow: 0 1px 2px #000; }
  .fs-thr .cap { position: absolute; bottom: -16px; left: -10px; right: -10px; text-align: center; font: 700 10px var(--display); letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.75); }

  .fs-help { position: absolute; right: 84px; top: calc(10px + var(--safe-t)); width: min(340px, calc(100vw - 96px)); max-height: calc(100% - 300px); min-height: 120px; overflow: auto; padding: 14px 16px; border-radius: 16px; background: rgba(8,20,34,.9); pointer-events: auto; font-size: 14px; line-height: 1.4; }

  .fs-help table { border-collapse: collapse; width: 100%; } .fs-help td { padding: 2px 4px; vertical-align: top; } .fs-help td:first-child { white-space: nowrap; color: var(--spark); font-weight: 700; }

  .cr-who b { font: 700 16px var(--display); letter-spacing: .03em; }
  .cr-say { display: grid; gap: 8px; margin: 12px 0; }
  .cr-say p { margin: 0; padding: 10px 14px; background: #fff; border-radius: 4px 14px 14px 14px; font-size: 16px; line-height: 1.4; box-shadow: inset 0 0 0 1px var(--rule); }
  .cr-real { margin: 12px 0 4px; padding: 10px 12px 10px 40px; border-radius: 12px; background: rgba(47,138,87,.1); color: #20583a; font-size: 14px; position: relative; }
  .cr-real::before { content: "\u{1F30D}"; position: absolute; left: 12px; top: 9px; font-size: 18px; }
  .cr-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
  .cr-actions .btn { flex: 1 1 140px; }
  .cr-sheet .btn.ghost { color: var(--pi); background: rgba(29,43,74,.08); box-shadow: inset 0 0 0 1px var(--rule); }
  .layer-career .btn[disabled] { filter: grayscale(.9); opacity: .5; box-shadow: none; cursor: default; }
  .cr-note { font-size: 13px; color: var(--pi2); margin-top: 8px; }
  .cr-warn { font-size: 13px; color: var(--red); margin-top: 8px; }
  .cr-stars { display: flex; justify-content: center; gap: 6px; font-size: 46px; margin: 8px 0; }
  .cr-stars span { filter: grayscale(1); opacity: .25; transform: scale(.7); transition: transform .35s cubic-bezier(.3,1.6,.5,1), opacity .2s, filter .2s; }
  .cr-stars span.on { filter: none; opacity: 1; transform: scale(1); }
  .cr-rows { display: grid; gap: 4px; margin: 10px 0; font-size: 15px; }
  .cr-rows div { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--rule); }
  .cr-rows div b { font-family: var(--mono); font-size: 14px; white-space: nowrap; }
  .cr-rows div.tot { border-bottom: 0; border-top: 2px solid var(--pi); font-weight: 700; }
  .cr-stamp { display: inline-block; margin: 8px 0; padding: 6px 14px; border: 3px solid var(--red); color: var(--red); border-radius: 8px; font: 800 18px var(--display); letter-spacing: .1em; text-transform: uppercase; transform: rotate(-4deg); }
  .cr-list { margin: 6px 0; padding-left: 20px; font-size: 15px; }

  /* callsign picker */
  .cr-calls { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
  .cr-calls button { border: 0; border-radius: 12px; padding: 12px 10px; font: 400 18px var(--hand); background: #fff; color: var(--pi); box-shadow: 0 2px 0 rgba(29,43,74,.18), inset 0 0 0 1px var(--rule); }

  /* in flight: the sim's HUD owns the top row, the top-right buttons, the middle (STALL) and the bottom corners;
     the card and its round buttons sit on the left below the instruments (placed exactly by layoutFly()) */
  .cr-fly > * { pointer-events: auto; }
  .cr-col { position: absolute; top: calc(84px + var(--safe-t)); left: 74px; width: min(320px, calc(50% - 180px)); max-height: calc(100% - 290px); display: flex; flex-direction: column; align-items: stretch; gap: 8px; transition: opacity .2s; }
  .cr-col.dim { opacity: .2; }
  .cr-fly > .cr-col, .cr-fly > .cr-glide { pointer-events: none; }
  .cr-col > * { pointer-events: auto; }
  .cr-card { box-sizing: border-box; flex: none;
    background: rgba(246,239,218,.96); color: var(--pi); border-radius: 16px; padding: 10px 12px 10px 10px; box-shadow: 0 8px 24px rgba(0,0,0,.3); display: grid; grid-template-columns: 40px 1fr; gap: 4px 10px; }
  .cr-card .cr-face { width: 40px; height: 40px; font-size: 22px; grid-row: span 3; }
  .cr-card .say { font: 600 16px/1.3 var(--body); }
  .cr-card .hint { font-size: 13.5px; color: #8a5a08; background: rgba(255,210,63,.25); border-radius: 8px; padding: 4px 8px; }
  .cr-card .meta { display: flex; align-items: center; gap: 8px; font: 700 11px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--pi2); }
  .cr-card .meta .cr-bar { flex: 1; height: 7px; }
  .cr-guide { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 99px; background: var(--pi); color: #fff; font: 700 12px var(--mono); letter-spacing: 0; text-transform: none; }
  .cr-guide i { display: inline-block; font-style: normal; transition: transform .2s; }
  .cr-side { position: absolute; top: calc(84px + var(--safe-t)); left: 12px; display: grid; gap: 8px; }
  .cr-side.two { grid-template-columns: repeat(2, 46px); gap: 6px; }
  .cr-side button { width: 52px; height: 52px; border-radius: 50%; border: 0; font-size: 22px; background: var(--glass); color: #fff; box-shadow: inset 0 0 0 1px var(--glass-line); display: grid; place-items: center; position: relative; }
  .cr-side button.on { background: var(--accent); }
  .cr-side button small { position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); font: 700 9px var(--display); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .cr-check { flex: 0 1 auto; min-height: 96px; overflow-y: auto; box-sizing: border-box;
    background: rgba(246,239,218,.97); color: var(--pi); border-radius: 16px; padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.3); display: grid; gap: 6px; }
  .cr-check button { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 8px; text-align: left; border: 0; border-radius: 10px; padding: 9px 10px; background: #fff; color: var(--pi); font: 600 15px var(--body); box-shadow: inset 0 0 0 1px var(--rule); }
  .cr-check button small { display: block; font-weight: 400; font-size: 12.5px; color: var(--pi2); }
  .cr-check button .box { width: 24px; height: 24px; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--pi2); display: grid; place-items: center; font-size: 16px; }
  .cr-check button.done { opacity: .55; }
  .cr-check button.done .box { background: var(--grn); box-shadow: none; color: #fff; }
  .cr-check button.next { box-shadow: inset 0 0 0 2px var(--accent); }
  .cr-act { align-self: center; font-size: 19px !important; padding: 16px 24px !important; }
  .cr-act[disabled] { filter: grayscale(.8); opacity: .6; }
  .cr-toast { align-self: center; max-width: 100%; padding: 8px 14px; border-radius: 12px; background: var(--pi, #1d2b4a); color: #fff; font: 600 15px var(--body); box-shadow: 0 6px 16px rgba(0,0,0,.3); pointer-events: none !important; text-align: center; }
  .cr-glide { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 30px; height: 150px; border-radius: 15px; background: rgba(9,22,38,.75); box-shadow: inset 0 0 0 1px var(--glass-line); }
  .cr-glide::before { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 2px; background: #fff; }
  .cr-glide i { position: absolute; left: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; background: #ff4fd8; transform: rotate(45deg); transition: top .15s; }
  .cr-glide b { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font: 700 10px var(--display); letter-spacing: .1em; color: #fff; text-shadow: 0 1px 2px #000; }
  .cr-veil { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(9,22,38,.45); overflow-y: auto; }
  @media (max-width: 700px), (max-height: 500px) {
    .cr-side button { width: 46px; height: 46px; font-size: 19px; }
  }
  @media (max-width: 700px) { .cr-glide { top: 55%; } }
  /* a phone on its side: a short card, the checklist in columns */
  @media (max-height: 500px) {
    .cr-card { grid-template-columns: 30px 1fr; padding: 6px 10px 6px 6px; }
    .cr-card .cr-face { width: 30px; height: 30px; font-size: 17px; }
    .cr-card .say { font-size: 14px; }
    .cr-check { min-height: 0; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
    .cr-check button { padding: 6px 8px; font-size: 14px; }
    .cr-check button small { display: none; }
    .cr-act { padding: 10px 18px !important; font-size: 16px !important; }
  }

  /* ground school & walkaround: the plane on top, panels around it */
  .cr-quiz { position: absolute; left: 50%; bottom: calc(16px + var(--safe-b)); transform: translateX(-50%); width: min(620px, calc(100% - 24px)); max-height: calc(100% - 88px - var(--safe-t) - var(--safe-b)); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .cr-quiz .opts { display: grid; gap: 8px; margin-top: 10px; }
  .cr-quiz .opts button { border: 0; border-radius: 12px; padding: 13px 14px; text-align: left; font: 600 16px var(--body); background: #fff; color: var(--pi); box-shadow: 0 2px 0 rgba(29,43,74,.2), inset 0 0 0 1px var(--rule); }
  .cr-quiz .opts button.right { background: #d8f2e2; box-shadow: inset 0 0 0 2px var(--grn); }
  .cr-quiz .opts button.wrong { background: #f8dcd9; box-shadow: inset 0 0 0 2px var(--red); }
  .cr-quiz .q { font: 700 18px/1.3 var(--body); margin: 4px 0 0; }
  .cr-dots { display: flex; gap: 5px; }
  .cr-dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(29,43,74,.15); }
  .cr-dots i.on { background: var(--accent); }
  .cr-walk { position: absolute; inset: 0; touch-action: none; }
  .cr-hot { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 3px solid #fff; background: var(--accent); color: #fff; font: 800 15px var(--display); display: grid; place-items: center; box-shadow: 0 3px 10px rgba(0,0,0,.35); padding: 0; }
  .cr-hot::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid rgba(255,138,31,.7); animation: crPulse 1.6s ease-out infinite; }
  .cr-hot.done { background: var(--grn); }
  .cr-hot.done::after, .cr-hot.far::after { display: none; }
  .cr-hot.far { opacity: .45; transform: scale(.8); }
  .cr-hot.sel { background: var(--pi); }
  @keyframes crPulse { from { transform: scale(.8); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .cr-wlist { position: absolute; right: 12px; top: calc(70px + var(--safe-t)); bottom: calc(16px + var(--safe-b)); width: 250px; overflow-y: auto; box-sizing: border-box; background: rgba(246,239,218,.96); color: var(--pi); border-radius: 16px; padding: 10px; display: grid; align-content: start; gap: 5px; }
  .cr-wlist h4 { margin: 2px 4px 6px; font: 800 14px var(--display); letter-spacing: .1em; text-transform: uppercase; }
  .cr-wlist button { display: grid; grid-template-columns: 26px 1fr 20px; gap: 6px; align-items: center; text-align: left; border: 0; border-radius: 9px; padding: 7px 8px; background: #fff; color: var(--pi); font: 600 14px var(--body); box-shadow: inset 0 0 0 1px var(--rule); }
  .cr-wlist button i { font-style: normal; font: 800 12px var(--mono); width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
  .cr-wlist button.done i { background: var(--grn); }
  .cr-wlist button.sel { box-shadow: inset 0 0 0 2px var(--pi); }
  .cr-wlist .btn { margin-top: 6px; }
  .cr-item { position: absolute; left: calc(50% - 131px); bottom: calc(16px + var(--safe-b)); transform: translateX(-50%); width: min(460px, calc(100% - 300px)); box-sizing: border-box; padding: 14px 16px; }
  .cr-item h3 { font-size: 20px; }
  .cr-item .see { font: 600 17px/1.35 var(--body); margin: 8px 0 4px; }
  .cr-item .msg { font: 700 15px var(--body); margin-top: 8px; }
  .cr-item .msg.good { color: var(--grn); } .cr-item .msg.bad { color: var(--red); }
  @media (max-width: 760px) {
    .cr-wlist { top: auto; left: 12px; right: 12px; width: auto; height: 132px; bottom: calc(12px + var(--safe-b)); grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .cr-wlist h4 { grid-column: 1 / -1; }
    .cr-item { left: 50%; width: calc(100% - 24px); bottom: calc(154px + var(--safe-b)); }
  }

  /* plane shop and the reward */
  .cr-shop { max-width: 920px; margin: 0 auto; display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  .cr-shop .cr-sheet { width: auto; }
  .cr-shop .wide { grid-column: 1 / -1; }
  .cr-big { font: 800 clamp(30px, 5vw, 44px)/1 var(--mono); color: var(--grn); }
  .cr-buy { display: grid; gap: 6px; padding: 14px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 1px var(--rule); margin-top: 10px; }
  .cr-buy.have { box-shadow: inset 0 0 0 3px var(--grn); }
  .cr-buy b { font: 800 18px var(--display); letter-spacing: .03em; text-transform: uppercase; }
  .cr-buy .price { font: 700 20px var(--mono); }
  .cr-regn { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 14px 0; font: 800 34px var(--mono); }
  .cr-regn .slot { display: grid; gap: 4px; justify-items: center; }
  .cr-regn .slot button { border: 0; width: 52px; height: 40px; border-radius: 10px; background: rgba(29,43,74,.1); color: var(--pi); font-size: 18px; }
  .cr-regn .slot span { width: 52px; text-align: center; background: #f4c016; color: #16181b; border-radius: 8px; padding: 4px 0; }
  .cr-regn .fixed { background: #f4c016; color: #16181b; border-radius: 8px; padding: 4px 8px; }
  .cr-reward { position: absolute; left: 50%; bottom: calc(16px + var(--safe-b)); transform: translateX(-50%); width: min(560px, calc(100% - 24px)); }
  .cr-plate { display: inline-block; font: 800 30px var(--mono); background: #f4c016; color: #16181b; padding: 4px 14px; border-radius: 10px; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  @media (max-width: 700px) {
    .cr-book { grid-template-columns: 1fr; border-radius: 14px; }
    .cr-page.left { border-right: 0; border-bottom: 2px solid rgba(29,43,74,.12); box-shadow: none; }
    .cr-shop { grid-template-columns: 1fr; }
    .cr-ms { grid-template-columns: 1fr; }
    .cr-page.right { order: -1; }
  }
