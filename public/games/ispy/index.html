<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iSPY - Fire &amp; Ice Robot Squad</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    width: 100%; height: 100%;
    background: #0b1026;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
  #world { z-index: 1; }
  #hud { z-index: 2; }
</style>
</head>
<body>
<canvas id="world"></canvas>
<canvas id="hud"></canvas>
<script src="three.min.js"></script>
<script>
// ============================================================================
// iSPY - Fire & Ice Robot Squad
// Made by Yoel, Ezekiel, Areli & Dada for Yoel The G
// 3D arena game: team up Fire (BLAZE) and Ice (FROST) with robot buddy i-SPY
// to fix the Glitch Bots in Robot City.
// ============================================================================

// ---------------------------------------------------------------------------
// PLATFORM THEME
// ---------------------------------------------------------------------------
let platformTheme = 'blue-light';
try {
  platformTheme = window.parent.document.documentElement.getAttribute('data-theme') || 'blue-light';
} catch (e) {}

const THEMES = {
  'blue-light':  { primary: '#3b82f6', dark: '#1e40af', bg: '#f0f7ff', surface: '#ffffff', text: '#1e293b', accent: '#93c5fd', glow: 'rgba(59,130,246,0.4)' },
  'blue-dark':   { primary: '#60a5fa', dark: '#2563eb', bg: '#0f172a', surface: '#1e293b', text: '#e2e8f0', accent: '#1e3a5f', glow: 'rgba(96,165,250,0.3)' },
  'red-light':   { primary: '#ef4444', dark: '#991b1b', bg: '#fff5f5', surface: '#ffffff', text: '#1e293b', accent: '#fca5a5', glow: 'rgba(239,68,68,0.4)' },
  'red-dark':    { primary: '#f87171', dark: '#dc2626', bg: '#1a0a0a', surface: '#2d1515', text: '#fecaca', accent: '#4a1515', glow: 'rgba(248,113,113,0.3)' },
};
const theme = THEMES[platformTheme] || THEMES['blue-light'];

// ---------------------------------------------------------------------------
// XP REPORTING
// ---------------------------------------------------------------------------
let xpTimer = 0;
function reportXP() {
  try { window.parent.postMessage({ type: 'xp', amount: 10 }, '*'); } catch (e) {}
}
function onGameOver(finalScore) {
  try { window.parent.postMessage({ type: 'gameOver', score: finalScore }, '*'); } catch (e) {}
}

// ---------------------------------------------------------------------------
// CONSTANTS
// ---------------------------------------------------------------------------
const ARENA_R = 16;          // arena radius (world units)
const PLAYER_SPEED = 8.5;
const MAX_LIVES = 2;
const MAX_ENERGY = 100;
const FONT = '"Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", Arial, sans-serif';
const FIRE = 'fire', ICE = 'ice';

const HERO_INFO = {
  fire: { name: 'BLAZE', color: '#ff7a1a', light: '#ffd23f', glow: 0xff5a00 },
  ice:  { name: 'FROST', color: '#38c8ff', light: '#c9f4ff', glow: 0x2fb8ff },
};

// Each level: look + enemy mix. Enemy speeds scale up so later levels feel fast.
const LEVELS = [
  { name: 'Robot Factory', goal: 14, maxAlive: 5, speed: 3.6, spawnGap: 1.5,
    types: ['basic', 'basic', 'basic', 'hot', 'cold'],
    sky: ['#7fd3ff', '#bfe9ff', '#ffe6b0'], fog: 0xbfe3ff, floor: '#56627e', trim: '#ffb400', sun: 0xfff2d6, hemi: [0xcfeeff, 0x6a5a4a], spyRate: 2.6 },
  { name: 'Neon City', goal: 20, maxAlive: 6, speed: 4.2, spawnGap: 1.2,
    types: ['basic', 'hot', 'cold', 'hot', 'cold', 'drone', 'drone'],
    sky: ['#3a1c71', '#b44bd6', '#ff8fb1'], fog: 0x6a3a9a, floor: '#3f4468', trim: '#ff3df0', sun: 0xffd0f0, hemi: [0xd8b8ff, 0x3a2a5a], spyRate: 2.3 },
  { name: 'Sky Tower', goal: 16, maxAlive: 7, speed: 4.8, spawnGap: 1.0,
    types: ['hot', 'cold', 'drone', 'bouncer', 'hot', 'cold', 'bouncer'],
    sky: ['#ff7e5f', '#feb47b', '#ffe8c2'], fog: 0xffc9a0, floor: '#5f6a86', trim: '#39ffb0', sun: 0xffe0b8, hemi: [0xffe3cc, 0x6a4a3a], spyRate: 2.0, boss: true },
];

// ---------------------------------------------------------------------------
// SETUP: renderer, HUD canvas, scene, camera
// ---------------------------------------------------------------------------
const worldCanvas = document.getElementById('world');
const hudCanvas = document.getElementById('hud');
const hud = hudCanvas.getContext('2d');
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

const renderer = new THREE.WebGLRenderer({ canvas: worldCanvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.75 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
// Studio-style environment map gives the metal robots realistic reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 400);
let W = 0, H = 0, DPR = 1;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setSize(W, H, false);
  hudCanvas.width = Math.round(W * DPR); hudCanvas.height = Math.round(H * DPR);
  camera.aspect = W / H;
  // Portrait screens need a taller field of view so the arena still fits
  camera.fov = W < H ? 62 : 50;
  camera.updateProjectionMatrix();
  layoutButtons();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

// ---------------------------------------------------------------------------
// LIGHTING
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xcfeeff, 0x6a5a4a, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d6, 2.2);
sun.position.set(12, 24, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 70;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.03;
scene.add(sun);
scene.add(sun.target);
// Hero glow light (changes color with element)
const heroLight = new THREE.PointLight(0xff5a00, 6, 9, 2);
scene.add(heroLight);

// ---------------------------------------------------------------------------
// PROCEDURAL TEXTURES (drawn with code, no image files)
// ---------------------------------------------------------------------------
function makeCanvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function skyTexture(cols) {
  return makeCanvasTex(16, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, cols[0]); gr.addColorStop(0.55, cols[1]); gr.addColorStop(1, cols[2]);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
}
function floorTexture(base, trim) {
  const t = makeCanvasTex(512, 512, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    const n = 4, s = w / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const shade = ((i + j) % 2) ? 0.06 : -0.04;
      g.fillStyle = shade > 0 ? 'rgba(255,255,255,' + shade + ')' : 'rgba(0,0,0,' + (-shade) + ')';
      g.fillRect(i * s + 3, j * s + 3, s - 6, s - 6);
      // rivets
      g.fillStyle = 'rgba(255,255,255,0.35)';
      [[10, 10], [s - 10, 10], [10, s - 10], [s - 10, s - 10]].forEach(p => {
        g.beginPath(); g.arc(i * s + p[0], j * s + p[1], 3.5, 0, Math.PI * 2); g.fill();
      });
      // tread lines
      g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = 3;
      for (let k = 1; k < 4; k++) {
        g.beginPath(); g.moveTo(i * s + 20, j * s + k * s / 4); g.lineTo(i * s + s - 20, j * s + k * s / 4); g.stroke();
      }
    }
    g.strokeStyle = trim; g.globalAlpha = 0.5; g.lineWidth = 4;
    g.strokeRect(2, 2, w - 4, h - 4);
    g.globalAlpha = 1;
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(5, 5);
  t.anisotropy = 4;
  return t;
}
function glowTexture() {
  return makeCanvasTex(64, 64, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.35, 'rgba(255,255,255,0.55)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
}
function windowTexture() {
  const t = makeCanvasTex(64, 128, (g, w, h) => {
    g.fillStyle = '#1b2240'; g.fillRect(0, 0, w, h);
    for (let y = 6; y < h - 6; y += 12) for (let x = 6; x < w - 6; x += 14) {
      const lit = Math.random() < 0.55;
      g.fillStyle = lit ? (Math.random() < 0.5 ? '#ffe9a8' : '#9fe8ff') : '#2a3358';
      g.fillRect(x, y, 8, 7);
    }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const GLOW_TEX = glowTexture();

// ---------------------------------------------------------------------------
// SHARED MATERIALS & GEOMETRY
// ---------------------------------------------------------------------------
function metal(color, rough = 0.35, metalness = 0.75, emissive = 0x000000, ei = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness, emissive, emissiveIntensity: ei });
}
function glowMat(color, intensity = 2) {
  return new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: intensity, roughness: 0.3, metalness: 0.1 });
}
const GEO = {
  sphere: new THREE.SphereGeometry(1, 24, 16),
  sphereLo: new THREE.SphereGeometry(1, 12, 8),
  capsule: new THREE.CapsuleGeometry(0.5, 0.6, 6, 16),
  box: new THREE.BoxGeometry(1, 1, 1),
  cone: new THREE.ConeGeometry(0.5, 1, 12),
  cyl: new THREE.CylinderGeometry(0.5, 0.5, 1, 20),
  torus: new THREE.TorusGeometry(1, 0.08, 8, 48),
  octa: new THREE.OctahedronGeometry(0.5, 0),
  gear: new THREE.TorusGeometry(0.28, 0.1, 6, 10),
  ring: new THREE.RingGeometry(0.9, 1, 48),
};
const WHITE = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.0 });
const BLACK = new THREE.MeshStandardMaterial({ color: 0x111522, roughness: 0.2, metalness: 0.3 });

function mesh(geo, mat, sx = 1, sy = sx, sz = sx) {
  const m = new THREE.Mesh(geo, mat);
  m.scale.set(sx, sy, sz);
  m.castShadow = true;
  return m;
}
function glowSprite(color, size, opacity = 0.9) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW_TEX, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false }));
  s.scale.set(size, size, 1);
  return s;
}

// ---------------------------------------------------------------------------
// WORLD: sky, arena, city layers (3 depth layers for parallax)
// ---------------------------------------------------------------------------
const world = { levelIdx: 0 };
const skyMat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, fog: false, depthWrite: false });
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(200, 32, 16), skyMat);
scene.add(skyDome);
scene.fog = new THREE.Fog(0xbfe3ff, 45, 150);

// Arena floor
const floorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0.55 });
const floor = new THREE.Mesh(new THREE.CylinderGeometry(ARENA_R + 1.2, ARENA_R + 2.2, 1.2, 64), floorMat);
floor.position.y = -0.6;
floor.receiveShadow = true;
scene.add(floor);
// Glowing arena edge ring
const edgeMat = glowMat(0xffb400, 1.6);
const edgeRing = new THREE.Mesh(new THREE.TorusGeometry(ARENA_R + 1.2, 0.18, 10, 96), edgeMat);
edgeRing.rotation.x = Math.PI / 2;
edgeRing.position.y = 0.02;
scene.add(edgeRing);
// Center emblem ring
const emblem = new THREE.Mesh(new THREE.RingGeometry(3.2, 3.6, 64), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 }));
emblem.rotation.x = -Math.PI / 2; emblem.position.y = 0.01;
scene.add(emblem);

// Arena pylons around the rim (near layer)
const pylons = [];
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
  const g = new THREE.Group();
  const post = mesh(GEO.cyl, metal(0x9aa6c0, 0.3, 0.9), 0.7, 3.2, 0.7);
  post.position.y = 1.6;
  const cap = mesh(GEO.sphere, glowMat(0xffb400, 2.2), 0.45);
  cap.position.y = 3.4;
  g.add(post, cap);
  g.position.set(Math.cos(a) * (ARENA_R + 2.6), 0, Math.sin(a) * (ARENA_R + 2.6));
  g.userData.cap = cap;
  scene.add(g);
  pylons.push(g);
}

// Mid layer: giant spinning factory gears
const bigGears = [];
const gearMat = metal(0x7d8aa6, 0.4, 0.85);
for (let i = 0; i < 5; i++) {
  const gear = new THREE.Group();
  const r = 4 + Math.random() * 3;
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(r, r * 0.16, 8, 40), gearMat);
  gear.add(wheel);
  const teeth = 14;
  for (let t = 0; t < teeth; t++) {
    const tooth = new THREE.Mesh(GEO.box, gearMat);
    const ta = (t / teeth) * Math.PI * 2;
    tooth.scale.set(r * 0.28, r * 0.28, r * 0.25);
    tooth.position.set(Math.cos(ta) * r * 1.15, Math.sin(ta) * r * 1.15, 0);
    tooth.rotation.z = ta;
    gear.add(tooth);
  }
  const hub = new THREE.Mesh(GEO.cyl, metal(0xffb400, 0.3, 0.8));
  hub.scale.set(r * 0.35, r * 0.3, r * 0.35); hub.rotation.x = Math.PI / 2;
  gear.add(hub);
  const a = -Math.PI * 0.15 - (i / 4) * Math.PI * 0.7;
  const dist = 52 + Math.random() * 12;
  gear.position.set(Math.cos(a) * dist, 4 + Math.random() * 9, Math.sin(a) * dist);
  gear.lookAt(0, gear.position.y, 0);
  gear.userData.spin = (Math.random() < 0.5 ? -1 : 1) * (0.15 + Math.random() * 0.25);
  scene.add(gear);
  bigGears.push(gear);
}

// Far layer: robot city skyline with glowing windows
const skyline = new THREE.Group();
const winTex = windowTexture();
for (let i = 0; i < 46; i++) {
  const a = (i / 46) * Math.PI * 2;
  const dist = 75 + Math.random() * 35;
  const h = 12 + Math.random() * 38;
  const wdt = 5 + Math.random() * 7;
  const tex = winTex.clone(); tex.needsUpdate = true;
  tex.repeat.set(wdt / 8, h / 10);
  const mat = new THREE.MeshStandardMaterial({ color: 0x8090b8, map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.6, roughness: 0.6, metalness: 0.4 });
  const b = new THREE.Mesh(GEO.box, mat);
  b.scale.set(wdt, h, wdt);
  b.position.set(Math.cos(a) * dist, h / 2 - 8, Math.sin(a) * dist);
  b.lookAt(0, b.position.y, 0);
  skyline.add(b);
  if (Math.random() < 0.45) {
    const ant = new THREE.Mesh(GEO.cyl, metal(0xcccccc));
    ant.scale.set(0.3, 6, 0.3);
    ant.position.set(b.position.x, h - 8 + 3, b.position.z);
    skyline.add(ant);
    const blink = glowSprite(0xff4466, 3.5);
    blink.position.set(b.position.x, h - 8 + 6.3, b.position.z);
    skyline.add(blink);
  }
}
scene.add(skyline);

// Ambient floating sparkles: fire embers + snowflakes (Fire & Ice!)
const AMBIENT_N = 60;
const ambientGeo = new THREE.BufferGeometry();
const ambPos = new Float32Array(AMBIENT_N * 3);
const ambCol = new Float32Array(AMBIENT_N * 3);
const ambVel = [];
for (let i = 0; i < AMBIENT_N; i++) {
  ambPos[i * 3] = (Math.random() - 0.5) * 50;
  ambPos[i * 3 + 1] = Math.random() * 16;
  ambPos[i * 3 + 2] = (Math.random() - 0.5) * 50;
  const fire = i % 2 === 0;
  const c = new THREE.Color(fire ? 0xffa040 : 0x9fe8ff);
  ambCol[i * 3] = c.r; ambCol[i * 3 + 1] = c.g; ambCol[i * 3 + 2] = c.b;
  ambVel.push(fire ? 0.8 + Math.random() : -0.6 - Math.random() * 0.6);
}
ambientGeo.setAttribute('position', new THREE.BufferAttribute(ambPos, 3));
ambientGeo.setAttribute('color', new THREE.BufferAttribute(ambCol, 3));
const ambient = new THREE.Points(ambientGeo, new THREE.PointsMaterial({ size: 0.35, map: GLOW_TEX, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(ambient);

function applyLevelLook(idx) {
  const L = LEVELS[idx];
  if (skyMat.map) skyMat.map.dispose();
  skyMat.map = skyTexture(L.sky); skyMat.needsUpdate = true;
  scene.fog.color.setHex(L.fog);
  if (floorMat.map) floorMat.map.dispose();
  floorMat.map = floorTexture(L.floor, L.trim); floorMat.needsUpdate = true;
  const trim = new THREE.Color(L.trim);
  edgeMat.color.copy(trim); edgeMat.emissive.copy(trim);
  pylons.forEach(p => { p.userData.cap.material.color.copy(trim); p.userData.cap.material.emissive.copy(trim); });
  sun.color.setHex(L.sun);
  hemi.color.setHex(L.hemi[0]); hemi.groundColor.setHex(L.hemi[1]);
  // Neon City is at night: brighter windows, gears hidden; Sky Tower shows gears lower
  skyline.children.forEach(o => { if (o.material && o.material.emissiveMap) o.material.emissiveIntensity = idx === 1 ? 1.3 : 0.6; });
  bigGears.forEach(g => { g.visible = idx !== 1; });
  skyline.position.y = idx === 2 ? -22 : 0; // up high on the tower: city is below us
}

// ---------------------------------------------------------------------------
// CHARACTER BUILDERS (all shapes built from 3D primitives)
// ---------------------------------------------------------------------------
function buildHero(kind) {
  const isFire = kind === FIRE;
  const bodyCol = isFire ? 0xe8531f : 0x2aa8e0;
  const trimCol = isFire ? 0xffc24a : 0xe8fbff;
  const glowCol = isFire ? 0xff7a1a : 0x6fe0ff;
  const g = new THREE.Group();
  const rig = new THREE.Group(); g.add(rig);

  const body = mesh(GEO.capsule, metal(bodyCol, 0.28, 0.7), 1.05, 0.95, 0.9);
  body.position.y = 1.15; rig.add(body);
  const belly = mesh(GEO.sphere, metal(trimCol, 0.25, 0.6), 0.36, 0.42, 0.2);
  belly.position.set(0, 1.05, 0.42); rig.add(belly);
  const core = mesh(GEO.sphere, glowMat(glowCol, 3), 0.14);
  core.position.set(0, 1.1, 0.55); rig.add(core);

  const head = new THREE.Group(); head.position.y = 2.2; rig.add(head);
  const skull = mesh(GEO.sphere, metal(bodyCol, 0.25, 0.7), 0.62, 0.56, 0.58);
  head.add(skull);
  const visor = mesh(GEO.sphere, new THREE.MeshStandardMaterial({ color: 0x0c1330, roughness: 0.05, metalness: 0.6 }), 0.5, 0.3, 0.3);
  visor.position.set(0, 0.02, 0.36); head.add(visor);
  const eyeMat = glowMat(isFire ? 0xfff27a : 0xc9f4ff, 3);
  const eyeL = mesh(GEO.sphere, eyeMat, 0.09, 0.12, 0.05); eyeL.position.set(-0.17, 0.04, 0.63); head.add(eyeL);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.17; head.add(eyeR);
  const smile = mesh(GEO.torus, eyeMat, 0.1, 0.1, 0.1); smile.rotation.z = Math.PI; smile.position.set(0, -0.12, 0.62);
  smile.geometry = new THREE.TorusGeometry(1, 0.18, 6, 16, Math.PI); head.add(smile);

  // Crown: flames for BLAZE, ice crystals for FROST
  const crown = [];
  for (let i = 0; i < 5; i++) {
    const a = (i - 2) * 0.38;
    let c;
    if (isFire) {
      c = mesh(GEO.cone, glowMat(i % 2 ? 0xffb020 : 0xff5a10, 2.2), 0.28, 0.75, 0.28);
    } else {
      c = mesh(GEO.octa, new THREE.MeshStandardMaterial({ color: 0xbff0ff, emissive: 0x4fcfff, emissiveIntensity: 1.2, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.9 }), 0.42, 1.1, 0.42);
    }
    c.position.set(Math.sin(a) * 0.45, 0.5 + Math.cos(a) * 0.12 - Math.abs(i - 2) * 0.06, -0.05 - Math.abs(a) * 0.2);
    c.rotation.z = -a * 0.8;
    c.userData.baseY = c.position.y;
    head.add(c); crown.push(c);
  }

  // Arms & legs
  const limbMat = metal(0x3b4258, 0.35, 0.8);
  const handMat = metal(trimCol, 0.3, 0.6);
  function arm(side) {
    const a = new THREE.Group(); a.position.set(side * 0.62, 1.55, 0);
    const up = mesh(GEO.capsule, limbMat, 0.32, 0.55, 0.32); up.position.y = -0.3; a.add(up);
    const hand = mesh(GEO.sphere, handMat, 0.26); hand.position.y = -0.72; a.add(hand);
    rig.add(a); return a;
  }
  function leg(side) {
    const l = new THREE.Group(); l.position.set(side * 0.3, 0.55, 0);
    const up = mesh(GEO.capsule, limbMat, 0.34, 0.4, 0.34); up.position.y = -0.2; l.add(up);
    const foot = mesh(GEO.sphere, metal(bodyCol, 0.3, 0.7), 0.3, 0.2, 0.42); foot.position.set(0, -0.48, 0.1); l.add(foot);
    rig.add(l); return l;
  }
  const armL = arm(-1), armR = arm(1), legL = leg(-1), legR = leg(1);
  // Back jet pack
  const pack = mesh(GEO.box, metal(0x596380, 0.3, 0.85), 0.7, 0.8, 0.35); pack.position.set(0, 1.35, -0.5); rig.add(pack);
  const jetGlow = glowSprite(glowCol, 1.1, 0.8); jetGlow.position.set(0, 0.85, -0.55); rig.add(jetGlow);

  hot:     { body: 0xff6a3d, trim: 0xffd166, eye: 0xfff27a, hp: 3, size: 1.0, score: 150 },

function buildBot(type) {
  const st = BOT_STYLE[type];
  const g = new THREE.Group();
  const rig = new THREE.Group(); g.add(rig);
  const bodyMat = metal(st.body, 0.3, 0.65, type === 'hot' ? 0xff3300 : type === 'cold' ? 0x0088ff : 0x000000, type === 'hot' || type === 'cold' ? 0.35 : 0);
  const trimMat = metal(st.trim, 0.3, 0.6);
  let body;
  if (type === 'drone') {
    body = mesh(GEO.sphere, bodyMat, 0.7, 0.5, 0.7); body.position.y = 0; rig.add(body);
    const disk = mesh(GEO.cyl, trimMat, 1.8, 0.12, 1.8); rig.add(disk);
    const glow = glowSprite(st.body, 2.2, 0.5); glow.position.y = -0.5; rig.add(glow);
  } else {
    body = mesh(GEO.box, bodyMat, 1.2, 1.1, 1.0); body.position.y = 0.95; rig.add(body);
    const belly = mesh(GEO.box, trimMat, 0.8, 0.5, 0.1); belly.position.set(0, 0.85, 0.52); rig.add(belly);
    const legL = mesh(GEO.cyl, metal(0x3b4258), 0.25, 0.5, 0.25); legL.position.set(-0.32, 0.25, 0); rig.add(legL);
    const legR = legL.clone(); legR.position.x = 0.32; rig.add(legR);
    const footL = mesh(GEO.sphere, trimMat, 0.28, 0.14, 0.34); footL.position.set(-0.32, 0.05, 0.08); rig.add(footL);
    const footR = footL.clone(); footR.position.x = 0.32; rig.add(footR);
    const armL = mesh(GEO.capsule, trimMat, 0.25, 0.5, 0.25); armL.position.set(-0.78, 0.95, 0); armL.rotation.z = 0.4; rig.add(armL);
    const armR = armL.clone(); armR.position.x = 0.78; armR.rotation.z = -0.4; rig.add(armR);
    g.userData.feet = [legL, legR, footL, footR];
    g.userData.arms = [armL, armR];
    if (type === 'bouncer') {
      const spring = mesh(GEO.torus, metal(0xcccccc), 0.45, 0.45, 1.2); spring.rotation.x = Math.PI / 2; spring.position.y = 0.1; rig.add(spring);
    }
  }
  // Googly eyes
  const eyeY = type === 'drone' ? 0.05 : 1.15;
  const eyeZ = type === 'drone' ? 0.6 : 0.52;
  const eyes = [];
  for (const sx of [-0.26, 0.26]) {
    const w = mesh(GEO.sphere, WHITE, 0.22, 0.22, 0.12); w.position.set(sx, eyeY, eyeZ); rig.add(w);
    const p = mesh(GEO.sphere, BLACK, 0.1, 0.1, 0.06); p.position.set(sx, eyeY, eyeZ + 0.1); rig.add(p);
    eyes.push(p);
  }
  // Antenna with blinking bulb
  const ant = mesh(GEO.cyl, metal(0xcccccc), 0.05, 0.45, 0.05); ant.position.y = type === 'drone' ? 0.6 : 1.7; rig.add(ant);
  const bulb = mesh(GEO.sphere, glowMat(st.eye, 3), 0.14); bulb.position.y = ant.position.y + 0.28; rig.add(bulb);
  // Element marker floating above hot/cold bots, so kids can spot which hero to use
  let marker = null;
  if (type === 'hot' || type === 'cold') {
    marker = glowSprite(type === 'hot' ? 0xff5a00 : 0x3dc2ff, 1.3, 0.9);
    marker.position.y = 2.6; rig.add(marker);

  if (type === 'boss') {

    const coreM = mesh(GEO.sphere, glowMat(0xff5a00, 3), 0.28); coreM.position.set(0, 0.9, 0.55); rig.add(coreM);
    g.userData.core = coreM;
  }
  g.scale.setScalar(st.size);
  g.userData.rig = rig; g.userData.eyes = eyes; g.userData.bulb = bulb; g.userData.bodyMat = bodyMat;
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}

let audioCtx = null;
let muted = false;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type = 'sine', vol = 0.15, slideTo = null, delay = 0) {
  if (muted || !audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator();
  const gn = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn); gn.connect(audioCtx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

function makePool(n, factory) {
  const arr = [];
  for (let i = 0; i < n; i++) { const o = factory(i); o.active = false; if (o.obj) { o.obj.visible = false; scene.add(o.obj); } arr.push(o); }
  arr.get = function () { for (const o of this) if (!o.active) { o.active = true; if (o.obj) o.obj.visible = true; return o; } return null; };
  arr.free = function (o) { o.active = false; if (o.obj) o.obj.visible = false; };
  arr.clear = function () { for (const o of this) this.free(o); };
  return arr;
}

function spawnParticles(pos, color, n, speed = 6, size = 0.6, grav = -6) {

const bots = [];         // active bots
const botPool = {};      // re-use built bot meshes per type
function getBotMesh(type) {
  const list = botPool[type] || (botPool[type] = []);
  const m = list.pop() || buildBot(type);
  m.visible = true; scene.add(m);
  return m;
}
function releaseBotMesh(b) {
  b.obj.visible = false; scene.remove(b.obj);
  (botPool[b.type] || (botPool[b.type] = [])).push(b.obj);
}

function spawnBot(type, pos) {
  const st = BOT_STYLE[type];
  const L = LEVELS[state.level];
  const obj = getBotMesh(type);
  let p = pos;
  if (!p) {
    // Spawn at the arena rim, away from the player
    let a = Math.random() * Math.PI * 2;
    for (let tries = 0; tries < 6; tries++) {
      const cand = new THREE.Vector3(Math.cos(a) * (ARENA_R - 1), 0, Math.sin(a) * (ARENA_R - 1));
      if (cand.distanceTo(player.pos) > 9) break;
      a += Math.PI / 3;
    }
    p = new THREE.Vector3(Math.cos(a) * (ARENA_R - 1), 0, Math.sin(a) * (ARENA_R - 1));
  }
  const b = {
    type, obj, pos: p.clone(), vel: new THREE.Vector3(), hp: st.hp, maxHp: st.hp,
    speed: L.speed * (type === 'drone' ? 0.85 : type === 'bouncer' ? 0.7 : type === 'boss' ? 0.55 : 1) * (0.9 + Math.random() * 0.2),
    radius: 0.8 * st.size, frozen: 0, chill: 0, flash: 0, t: Math.random() * 10, spawnT: 0,
    attackCd: 1 + Math.random(), lunge: 0, hopT: 0, y: 0, vy: 0,
    element: type === 'hot' ? 'hot' : type === 'cold' ? 'cold' : null,
    knock: new THREE.Vector3(), popping: 0,
  };
  obj.position.copy(b.pos);
  obj.scale.setScalar(0.01);
